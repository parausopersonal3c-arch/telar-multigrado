<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telar Multigrado</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --maroon-900:#3E1420;
    --maroon-700:#7A2333;
    --maroon-600:#8E2B3C;
    --maroon-100:#F3E1E4;
    --fill-maroon:#7A2333;
    --fill-maroon-strong:#4E1521;
    --on-fill:#FBF1EC;
    --gold-600:#A9792C;
    --gold-100:#F1E6CC;
    --ink-900:#241F19;
    --ink-700:#4A4238;
    --ink-500:#786F62;
    --paper-0:#FCFBF8;
    --paper-50:#F2F5EE;
    --paper-100:#E7ECE0;
    --paper-200:#DCE3D4;
    --line:rgba(36,31,25,0.14);
    --line-soft:rgba(36,31,25,0.08);
    --g1-ink:#2E6B41;
    --g1-tint:#E3EEE0;
    --g1-line:#BBD8C2;
    --g2-ink:#B25A22;
    --g2-tint:#F7E7D9;
    --g2-line:#E7C4A1;
    --g3-ink:#255A82;
    --g3-tint:#DCEAF3;
    --g3-line:#B8D4E6;
    --ok-ink:#2E6B41;
    --ok-tint:#E3EEE0;
    --warn-ink:#9C6A12;
    --warn-tint:#F6E9CC;
    --danger-ink:#A23434;
    --danger-tint:#F5DEDE;
    --shadow-1:0 1px 2px rgba(36,31,25,0.08), 0 1px 1px rgba(36,31,25,0.04);
    --shadow-2:0 8px 24px -8px rgba(36,31,25,0.22);
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    --font-display:'Zilla Slab', Georgia, 'Times New Roman', serif;
    --font-body:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --maroon-900:#F4D7DC;
      --maroon-700:#E58FA0;
      --maroon-600:#EDA3B1;
      --maroon-100:#3A1620;
      --gold-600:#D9B26A;
      --gold-100:#3A2E14;
      --ink-900:#EDE9E0;
      --ink-700:#C9C2B4;
      --ink-500:#948B7C;
      --paper-0:#1B1915;
      --paper-50:#201E19;
      --paper-100:#28251F;
      --paper-200:#332F27;
      --line:rgba(237,233,224,0.16);
      --line-soft:rgba(237,233,224,0.09);
      --g1-ink:#82C393;
      --g1-tint:#1E2B20;
      --g1-line:#37503B;
      --g2-ink:#E2A06C;
      --g2-tint:#2E2319;
      --g2-line:#54402C;
      --g3-ink:#7FB8DE;
      --g3-tint:#1B2A33;
      --g3-line:#324C5A;
      --ok-ink:#82C393;
      --ok-tint:#1E2B20;
      --warn-ink:#E0BB6B;
      --warn-tint:#332912;
      --danger-ink:#E1918C;
      --danger-tint:#3A2020;
      --shadow-1:0 1px 2px rgba(0,0,0,0.35);
      --shadow-2:0 8px 28px -8px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --maroon-900:#F4D7DC;
    --maroon-700:#E58FA0;
    --maroon-600:#EDA3B1;
    --maroon-100:#3A1620;
    --gold-600:#D9B26A;
    --gold-100:#3A2E14;
    --ink-900:#EDE9E0;
    --ink-700:#C9C2B4;
    --ink-500:#948B7C;
    --paper-0:#1B1915;
    --paper-50:#201E19;
    --paper-100:#28251F;
    --paper-200:#332F27;
    --line:rgba(237,233,224,0.16);
    --line-soft:rgba(237,233,224,0.09);
    --g1-ink:#82C393; --g1-tint:#1E2B20; --g1-line:#37503B;
    --g2-ink:#E2A06C; --g2-tint:#2E2319; --g2-line:#54402C;
    --g3-ink:#7FB8DE; --g3-tint:#1B2A33; --g3-line:#324C5A;
    --ok-ink:#82C393; --ok-tint:#1E2B20;
    --warn-ink:#E0BB6B; --warn-tint:#332912;
    --danger-ink:#E1918C; --danger-tint:#3A2020;
    --shadow-1:0 1px 2px rgba(0,0,0,0.35);
    --shadow-2:0 8px 28px -8px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--paper-50); color:var(--ink-900);
    font-family:var(--font-body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance; color:var(--ink-900);}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--maroon-700);}
  ::selection{background:var(--gold-100); color:var(--ink-900);}
  :focus-visible{outline:2px solid var(--maroon-600); outline-offset:2px;}

  .skip{position:fixed; top:-40px; left:8px; background:var(--paper-0); padding:8px 12px; z-index:200;}
  .skip:focus{top:8px;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:linear-gradient(180deg, var(--fill-maroon), var(--fill-maroon-strong));
    color:var(--on-fill);
    padding:14px clamp(16px,4vw,40px);
    display:flex; align-items:center; gap:14px;
    box-shadow:var(--shadow-2);
    position:sticky; top:0; z-index:50;
  }
  .seal{
    width:38px; height:38px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 32% 28%, var(--gold-100), var(--gold-600) 60%, #7a5a1c 100%);
    border:1px solid rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:15px; color:#3a2a0c;
  }
  .topbar-text{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .topbar-title{font-family:var(--font-display); font-weight:700; font-size:1.2rem; letter-spacing:0.01em;}
  .topbar-sub{font-size:0.76rem; letter-spacing:0.05em; text-transform:uppercase; opacity:0.82;}
  .topbar-actions{margin-left:auto; display:flex; gap:8px; align-items:center;}

  .btn{
    border:1px solid transparent; border-radius:999px; padding:9px 18px;
    font-size:0.88rem; font-weight:600; display:inline-flex; align-items:center; gap:7px;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--fill-maroon); color:var(--on-fill); box-shadow:var(--shadow-1);}
  .btn-primary:hover{background:var(--fill-maroon-strong);}
  .btn-primary:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-ghost{background:transparent; border-color:rgba(251,241,236,0.4); color:#FBF1EC;}
  .btn-ghost:hover{background:rgba(251,241,236,0.14);}
  .btn-line{background:var(--paper-0); border-color:var(--line); color:var(--ink-900);}
  .btn-line:hover{border-color:var(--maroon-700); color:var(--maroon-700);}
  .btn-sm{padding:6px 12px; font-size:0.78rem; border-radius:999px;}
  .btn-icon{padding:8px; border-radius:50%; background:transparent; border:1px solid var(--line); color:var(--ink-700);}

  main{max-width:1040px; margin:0 auto; padding:clamp(18px,4vw,40px) clamp(16px,4vw,24px) 100px;}

  /* ---------- Stepper ---------- */
  .stepper{display:flex; gap:0; margin-bottom:28px; border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; background:var(--paper-0); box-shadow:var(--shadow-1);}
  .step-tab{
    flex:1; padding:14px 10px; text-align:center; border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:3px; align-items:center; background:transparent; color:var(--ink-500);
    font-size:0.82rem;
  }
  .step-tab:last-child{border-right:none;}
  .step-tab .num{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:0.78rem; font-weight:600; border:1.5px solid var(--line); color:var(--ink-500);
  }
  .step-tab.active{color:var(--maroon-700); background:var(--maroon-100);}
  .step-tab.active .num{border-color:var(--fill-maroon); background:var(--fill-maroon); color:var(--on-fill);}
  .step-tab.done .num{border-color:var(--ok-ink); background:var(--ok-tint); color:var(--ok-ink);}
  .step-tab.done{color:var(--ok-ink);}
  .step-tab .label{font-weight:600; letter-spacing:0.01em;}

  /* ---------- Cards / sections ---------- */
  .card{
    background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-l);
    box-shadow:var(--shadow-1); padding:clamp(18px,3vw,30px); margin-bottom:20px;
  }
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:6px; flex-wrap:wrap;}
  .card-eyebrow{font-size:0.74rem; text-transform:uppercase; letter-spacing:0.09em; color:var(--gold-600); font-weight:700;}
  .card h2{font-size:1.5rem;}
  .card-desc{color:var(--ink-700); margin-top:6px; max-width:62ch;}

  .summary-bar{
    display:flex; align-items:center; gap:12px; padding:14px 18px; border:1px solid var(--line);
    border-radius:var(--radius-m); background:var(--paper-50); margin-bottom:18px; cursor:pointer;
  }
  .summary-bar .chk{width:22px; height:22px; border-radius:50%; background:var(--ok-tint); color:var(--ok-ink); display:flex; align-items:center; justify-content:center; flex:none; font-size:0.8rem;}
  .summary-bar .txt{flex:1; min-width:0;}
  .summary-bar .txt b{font-family:var(--font-display); font-size:1.02rem;}
  .summary-bar .txt span{display:block; color:var(--ink-500); font-size:0.84rem; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- Form ---------- */
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:0.84rem; font-weight:600; color:var(--ink-700);}
  .field .hint{font-size:0.76rem; color:var(--ink-500); font-weight:400;}
  input[type=text], input[type=number], textarea, select{
    font-family:var(--font-body); font-size:0.95rem; padding:10px 12px; border-radius:var(--radius-s);
    border:1px solid var(--line); background:var(--paper-0); color:var(--ink-900);
  }
  input:focus, textarea:focus, select:focus{border-color:var(--maroon-700);}
  textarea{resize:vertical; min-height:80px; font-family:var(--font-body);}
  .grade-inputs{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .grade-inputs .g{border-radius:var(--radius-s); padding:8px 10px; border:1px solid; display:flex; flex-direction:column; gap:4px;}
  .grade-inputs .g input{border:none; background:transparent; padding:2px 0; font-weight:600; font-size:1.05rem; width:100%;}
  .grade-inputs .g span{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;}
  .g1{border-color:var(--g1-line); background:var(--g1-tint); color:var(--g1-ink);}
  .g2{border-color:var(--g2-line); background:var(--g2-tint); color:var(--g2-ink);}
  .g3{border-color:var(--g3-line); background:var(--g3-tint); color:var(--g3-ink);}
  .g1 input, .g2 input, .g3 input{color:inherit;}

  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line-soft);}

  /* ---------- Trimestre / CI selector ---------- */
  .trimestre-block{margin-bottom:22px;}
  .trimestre-title{font-family:var(--font-mono); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-500); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .trimestre-title::after{content:""; flex:1; height:1px; background:var(--line);}
  .ci-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px;}
  .ci-card{
    text-align:left; border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 15px;
    background:var(--paper-0); display:flex; flex-direction:column; gap:8px; transition:border-color .12s, box-shadow .12s, transform .12s;
  }
  .ci-card:hover{border-color:var(--maroon-600); box-shadow:var(--shadow-1); transform:translateY(-1px);}
  .ci-card.selected{border-color:var(--maroon-700); background:var(--maroon-100); box-shadow:var(--shadow-1);}
  .ci-num{font-family:var(--font-mono); font-size:0.78rem; color:var(--gold-600); font-weight:700;}
  .ci-title{font-size:0.92rem; font-weight:600; line-height:1.35;}

  .ci-preview{border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; background:var(--paper-50); margin-top:18px;}
  .ci-preview h3{font-size:1.15rem; margin-bottom:4px;}
  .ci-preview .intencion{color:var(--ink-700); margin:8px 0 16px; font-size:0.92rem;}
  .grade-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .grade-col{border-radius:var(--radius-s); padding:12px; border:1px solid;}
  .grade-col h4{font-size:0.82rem; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;}
  .grade-col.g1{border-color:var(--g1-line);} .grade-col.g1 h4{color:var(--g1-ink);}
  .grade-col.g2{border-color:var(--g2-line);} .grade-col.g2 h4{color:var(--g2-ink);}
  .grade-col.g3{border-color:var(--g3-line);} .grade-col.g3 h4{color:var(--g3-ink);}
  .pda-item{font-size:0.8rem; margin-bottom:7px; line-height:1.4;}
  .pda-clave{font-family:var(--font-mono); font-size:0.68rem; background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:4px; margin-right:5px;}
  .producto-tag{display:inline-block; font-size:0.72rem; font-weight:700; padding:2px 8px; border-radius:999px; margin:1px 4px 1px 0;}

  /* ---------- Etapas / generation workspace ---------- */
  .etapas-progress{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:600;
    padding:6px 12px; border-radius:999px; border:1px solid var(--line); color:var(--ink-500); background:var(--paper-50);
  }
  .chip .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-500);}
  .chip.pending{}
  .chip.active{border-color:var(--maroon-700); color:var(--maroon-700); background:var(--maroon-100);}
  .chip.active .dot{background:var(--maroon-700); animation:pulse 1.1s ease-in-out infinite;}
  .chip.done{border-color:var(--ok-ink); color:var(--ok-ink); background:var(--ok-tint);}
  .chip.done .dot{background:var(--ok-ink);}
  .chip.error{border-color:var(--danger-ink); color:var(--danger-ink); background:var(--danger-tint);}
  .chip.error .dot{background:var(--danger-ink);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.25;}}
  @media (prefers-reduced-motion:reduce){ .chip.active .dot{animation:none;} }

  .etapa{border:1px solid var(--line); border-radius:var(--radius-l); margin-bottom:16px; overflow:hidden; background:var(--paper-0);}
  .etapa-head{display:flex; align-items:center; gap:12px; padding:16px 20px; background:var(--paper-50); border-bottom:1px solid var(--line);}
  .etapa-num{font-family:var(--font-display); font-size:1.4rem; font-weight:700; color:var(--gold-600); flex:none; width:32px;}
  .etapa-titles{flex:1; min-width:0;}
  .etapa-titles .et-name{font-family:var(--font-display); font-weight:600; font-size:1.08rem;}
  .etapa-titles .et-desc{font-size:0.78rem; color:var(--ink-500);}
  .etapa-actions{display:flex; gap:6px; flex:none;}
  .etapa-body{padding:20px 24px;}
  .etapa-body.empty{color:var(--ink-500); font-size:0.9rem; font-style:italic;}
  .grade-sub{margin-bottom:18px; padding-bottom:14px; border-bottom:1px dashed var(--line-soft);}
  .grade-sub:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .grade-sub-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .grade-sub-label{font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; padding:3px 10px; border-radius:999px;}
  .grade-sub-label.g1{background:var(--g1-tint); color:var(--g1-ink);}
  .grade-sub-label.g2{background:var(--g2-tint); color:var(--g2-ink);}
  .grade-sub-label.g3{background:var(--g3-tint); color:var(--g3-ink);}

  .prose{font-size:0.95rem; color:var(--ink-900);}
  .prose h5,.prose h6{font-family:var(--font-display); font-size:1rem; margin:14px 0 6px; color:var(--maroon-700);}
  .prose p{margin:0 0 10px; line-height:1.6;}
  .prose ul, .prose ol{margin:0 0 10px; padding-left:22px;}
  .prose li{margin-bottom:4px;}
  .prose strong{color:var(--ink-900);}
  .prose .script-box{
    background:var(--paper-50); border:1px solid var(--line); border-left:3px solid var(--gold-600);
    border-radius:var(--radius-s); padding:12px 14px; margin:10px 0 14px; font-family:var(--font-mono);
    font-size:0.82rem; white-space:pre-wrap; line-height:1.6; overflow-x:auto;
  }
  .cursor-blink{display:inline-block; width:2px; height:1em; background:var(--maroon-700); vertical-align:text-bottom; animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){ .cursor-blink{animation:none;} }

  .territorio-tag{font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:2px 8px; border-radius:999px; background:var(--gold-100); color:var(--gold-600); margin-right:6px;}

  .gen-cta{display:flex; flex-direction:column; align-items:center; gap:14px; padding:36px 20px; text-align:center; border:1.5px dashed var(--line); border-radius:var(--radius-l); background:var(--paper-50);}
  .gen-cta p{max-width:52ch; color:var(--ink-700);}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .toolbar-left{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- Historial ---------- */
  .historial-list{display:flex; flex-direction:column; gap:8px;}
  .historial-item{display:flex; align-items:center; gap:12px; padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--paper-50);}
  .historial-item .hi-txt{flex:1; min-width:0;}
  .historial-item .hi-txt b{font-size:0.9rem;}
  .historial-item .hi-txt span{display:block; font-size:0.76rem; color:var(--ink-500);}
  .historial-item .hi-actions{display:flex; gap:6px;}

  .empty-note{color:var(--ink-500); font-size:0.88rem; text-align:center; padding:20px;}

  .toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{background:var(--ink-900); color:var(--paper-0); padding:10px 18px; border-radius:999px; font-size:0.86rem; box-shadow:var(--shadow-2); max-width:88vw;}
  .toast.err{background:var(--danger-ink);}

  footer{text-align:center; color:var(--ink-500); font-size:0.78rem; padding:20px; max-width:62ch; margin:0 auto;}

  @media (max-width: 720px){
    .field-grid{grid-template-columns:1fr;}
    .grade-cols{grid-template-columns:1fr;}
    .grade-inputs{grid-template-columns:1fr;}
    .step-tab .label{display:none;}
    .topbar-sub{display:none;}
  }
</style>
</head>
<body>

<a class="skip" href="#main-content">Saltar al contenido</a>
<header class="topbar">
  <div class="seal" aria-hidden="true">NEM</div>
  <div class="topbar-text">
    <span class="topbar-title">Telar Multigrado</span>
    <span class="topbar-sub">Campo formativo Lenguajes · Telesecundaria</span>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" id="btn-historial" type="button">Historial</button>
    <button class="btn btn-ghost btn-sm" id="btn-reiniciar" type="button">Empezar de nuevo</button>
  </div>
</header>

<main id="main-content">
  <nav class="stepper" id="stepper" aria-label="Progreso"></nav>
  <div id="view-root"></div>
  <footer>Telar Multigrado genera propuestas didácticas con ayuda de inteligencia artificial a partir de las dosificaciones oficiales de Lenguajes. Revisa y adapta siempre el resultado antes de usarlo con tu grupo.</footer>

ina."},{"clave":"LISL 1.1","texto":"Hace uso del alfabeto, los números y las expresiones básicas de la lengua indígena (variante lingüística) del contexto, para nombrar datos factuales y características básicas de lenguas indígenas en México y el mundo."}],"subcontenidos":[{"clave":"1.1","texto":"La riqueza lingüística de México y el mundo, en obras literarias procedentes de distintas culturas."},{"clave":"1.2","texto":"La diversidad de lenguas indígenas existentes en México y el mundo."},{"clave":"1.3","texto":"Las manifestaciones artísticas de México y del mundo y su valoración como parte de la riqueza pluricultural."}],"intencionesSubcontenidos":[{"clave":"1.1","texto":"Reconocer la riqueza lingüística de México y el mundo a través de obras literarias procedentes de distintas culturas. Esto mediante un encuentro breve de lecturas comentadas para así fortalecer la comunicación familiar, escolar y comunitaria."},{"clave":"1.2","texto":"Elaborar unas tarjetas multiculturales comparativas con palabras o expresiones en inglés, en español y en algunas lenguas indígenas de México y América Latina. La finalidad es realizar algunos comentarios sobre la identidad de los pueblos donde se hablan estas lenguas, a partir de la integración y valoración del contenido de estas tarjetas"},{"clave":"1.3","texto":"Reconocer y valorar las manifestaciones artísticas de México y del mundo mediante el uso del cuerpo, el espacio y el tiempo a través de una tertulia artística que exprese la riqueza pluricultural"}]},"2":{"nombre":"1. La diversidad lingüística y artística de México y del mundo y su uso en la comunicación.","intencionDidacticaCI":"1. Reconocer la diversidad lingüística y artística de México y el mundo a través de la elaboración de un esquema ilustrado, una breve exposición en distintas lenguas y una narración festiva para valorar el simbolismo del lenguaje, las imágenes y las festividades como ejes de la comunicación de los saberes de una comunidad.","disciplinas":[{"clave":"ESP 1","texto":"La diversidad de lenguas y su uso en la comunicación familiar, escolar y comunitaria."},{"clave":"LILM 1","texto":"La diversidad de lenguas indígenas y su uso en la comunicación familiar, escolar y comunitario."},{"clave":"ART 1","texto":"Diversidad de lenguajes artísticos en la riqueza pluricultural de México y del mundo."},{"clave":"LISL 1","texto":"La diversidad lingüística y sus formas de expresión en México y el mundo."},{"clave":"ING 1","texto":"La diversidad lingüística y sus formas de expresión en México y el mundo."}],"pda":[{"clave":"ESP 1.1","texto":"Comprende las características y recursos lingüísticos de la lengua española, para usarlos y valorarlos como parte de la riqueza, pluricultural de México y el mundo."},{"clave":"LILM 1.1","texto":"Comprende las características culturales (cosmovisión) de la lengua indígena de su contexto y de otras lenguas indígenas, nacionales, utilizando la relación lengua-cultura."},{"clave":"ART 1.1","texto":"Explora la creación de secuencias y patrones ala identificar el uso de formas, colores, movimientos y sonidos, entre otros elementos de las artes, en manifestaciones artísticas de México y del mundo, para apreciar la riqueza pluricultural."},{"clave":"LISL 1.1","texto":"Comprende textos, narrativos y biográficos en la lengua indígena (variante lingüística) del contexto sobre la vida cotidiana, formas de interacción y comportamiento de hablantes, de diversas lenguas de México y el mundo en el pasado, expresado en organizadores gráficos."},{"clave":"ING 1.1","texto":"Comprende textos narrativos y biográficos en inglés sobre la vida cotidiana, formas de interacción y comportamiento de hablantes, de diversas lenguas de México y el mundo en el pasado, expresados en organizadores gráficos."}],"subcontenidos":[{"clave":"1.1","texto":"Los recursos lingüísticos de la lengua española."},{"clave":"1.2","texto":"La valoración y uso de la riqueza pluricultural."},{"clave":"1.3","texto":"La interacción y comportamiento de hablantes de diversas lenguas de México y el mundo."}],"intencionesSubcontenidos":[{"clave":"1.1","texto":"Identificar mediante un esquema ilustrado, las características, los recursos de la lengua española y la diversidad lingüística en un contexto comunicativo para valorarlos como parte de la riqueza pluricultural."},{"clave":"1.2","texto":"Reconocer, a través de una investigación y breve exposición en distintas lenguas, que los lenguajes escritos, orales y gráficos son un acto comunicativo para hacer énfasis en la diversidad en el contexto nacional e internacional."},{"clave":"1.3","texto":"Identificar la diversidad cultural de México y el mundo con los elementos artísticos y lingüísticos de su comunidad mediante una narración festiva en torno a las tradiciones y costumbres de su contexto para fomentar el pensamiento crítico y comparar con otras culturas del mundo."}]},"3":{"nombre":"1. La diversidad lingüística y artística de México y del mundo y su uso en la comunicación.","intencionDidacticaCI":"1. Explorar y representar la diversidad lingüística y artística de México y del mundo a través de un debate cultural con tarjetas, una exposición comunitaria y un folleto de divulgación lingüística para reconocer y valorar su uso en la comunicación.","disciplinas":[{"clave":"ESP 1","texto":"La diversidad de lenguas y su uso en la comunicación familiar, escolar y comunitaria."},{"clave":"ART 1","texto":"Diversidad de lenguajes artísticos en la riqueza pluricultural de México y del mundo."},{"clave":"LILM 1","texto":"La diversidad de lenguas indígenas y su uso en la comunicación familiar, escolar y comunitario."},{"clave":"LISL 1","texto":"La diversidad lingüística y sus formas de expresión en México y el mundo."},{"clave":"ING 1","texto":"La diversidad lingüística y sus formas de expresión en México y el mundo."}],"pda":[{"clave":"ESP 1.1","texto":"Analiza y reconoce algunas variantes lingüísticas de la lengua española, para valorarla como riqueza cultural."},{" , lingüística y artística de México y del mundo.","disciplinas":[{"clave":"ESP 2","texto":"La diversidad étnica, cultural y lingüística de México a favor de una sociedad intercultural."},{"clave":"ESP 3","texto":"Las lenguas como manifestación de la identidad y del sentido de pertenencia."},{"clave":"LISL 3","texto":"Las manifestaciones culturales, lingüísticas y artísticas en la lengua indígena (variante lingüística) del contexto, a favor de la interculturalidad."},{"clave":"ART 2","texto":"Manifestaciones culturales y artísticas que conforman la diversidad étnica, cultural y lingüística."},{"clave":"LILM 2","texto":"La diversidad étnica, cultural y lingüística de México en peligro."},{"clave":"LISL 2","texto":"La identidad y cultura de la lengua indígena (variante lingüística) del contexto escolar."},{"clave":"ING 3","texto":"Las manifestaciones culturales y lingüísticas y artísticas en inglés, a favor de la interculturalidad."}],"pda":[{"clave":"ESP 2.2","texto":"Comparte una propuesta creativa propia en la que valore y promueva textos en español a favor de una sociedad intercultural."},{"clave":"ESP 3.1","texto":"Elabora textos argumentativos acerca de la interculturalidad crítica, para reconocer el valor de las lenguas, a fin de promoverlas y fortalecerlas."},{"clave":"ESP 2.1","texto":"Practica la comunicación asertiva y el diálogo intercultural en interacción con otras personas."},{"clave":"LISL 3.1","texto":"Elabora guiones en la lengua indígena (variante lingüística) que traten sobre situaciones de conflicto resueltos mediante la comunicación asertiva e intercultural, y los dramatiza."},{"clave":"ART 2.1","texto":"Presenta una propuesta creativa, usando intencionalmente el cuerpo, espacio y tiempo, entre otros elementos de las artes, para valorar y promover la diversidad étnica, cultural y lingüística a favor de una sociedad intercultural."},{"clave":"LILM 2.1","texto":"Comprende analíticamente distintas visiones en torno al diálogo intercultural y la construcción de relaciones equitativas de convivencia entre culturas, así como el papel del conflicto y su resolución como base de la construcción de paz."},{"clave":"LILM 2.2","texto":"Comparte una propuesta creativa propia en la que valore y promueva textos en la lengua indígena de su contexto, a favor de una sociedad intercultural."},{"clave":"LISL 2.1","texto":"Construye una propuesta de comunicación oral y escrita en la lengua indígena (variante lingüística) del contexto, en la que contraste, valore y promueva rasgos de una sociedad intercultural."},{"clave":"ING 3.1","texto":"Elabora guiones en inglés que aborden situaciones de conflicto resueltas mediante la comunicación asertiva e intercultural, y los dramatiza."}],"subcontenidos":[{"clave":"2.1","texto":"Los textos argumentativos sobre la interculturalidad a través de propuestas creativas y dialógicas."},{"clave":"2.2","texto":"La resolución de conflictos en la interculturalidad."},{"clave":"2.3","texto":"La sociedad intercultural y sus rasgos desde la diversidad cultural y lingüística."}],"intencionesSubcontenidos":[{"clave":"2.1","texto":"Realizar un encuentro de argumentos dramatizados a partir de textos que contrasten rasgos de las sociedades, para fomentar y valorar el diálogo intercultural."},{"clave":"2.2","texto":"Investigar y personificar conflictos a favor de una sociedad intercultural a través de un juego de roles para la resolución de problemáticas comunitarias."},{"clave":"2.3","texto":"Reflexionar sobre los rasgos y distintas visiones acerca de la sociedad intercultural mediante un debate corto de la paz, en diversas lenguas, que favorezca la comunicación asertiva, constructora de paz."}]}}},{"numero":3,"trimestre":1,"titulo":"3. La cultura como manifestación de la identidad y del sentido de pertenencia.","grados":{"1":{"nombre":"3. La cultura como manifestación de la identidad y del sentido de pertenencia.","intencionDidacticaCI":"3. Conversar en comunidad de aula lo aprendido sobre la identidad personal y el sentido de pertenencia, la diversidad de opiniones sobre una misma situación y su reflejo al realizar una entrevista personal, elaboración de un objeto artesanal y realizar un cuadro comparativo.","disciplinas":[{"clave":"ESP 3","texto":"Las lenguas como manifestación de la identidad y del sentido de pertenencia."},{"clave":"ING 2","texto":"La identidad y cultura de pueblos de habla inglesa."},{"clave":"ART 3","texto":"Identidad y sentido de pertenencia en manifestaciones artísticas."},{"clave":"LILM 3","texto":"Las lenguas indígenas como manifestación de la identidad y del sentido de pertenencia."},{"clave":"LISL 2","texto":"La identidad y cultura de la lengua indígena (variante lingüística) del contexto escolar."}],"pda":[{"clave":"ESP 3.1","texto":"Describe en un texto cómo el lenguaje oral manifiesta las identidades personal y colectiva, para reconocer lo común y lo diferente."},{"clave":"ING 2.1","texto":"Recupera información para llevar a cabo presentaciones en inglés, orales y escritas, que describan rasgos étnicos, culturales e identitarios de hablante"},{"clave":"ART 3.1","texto":"Aprecia la intención expresiva en diversas manifestaciones artísticas, para la construcción crítica de la identidad personal y colectiva."},{"clave":"LILM 3.1","texto":"Describe cómo el lenguaje oral manifiesta las identidades personal y colectiva, para reconocer procesos de transmisión o ruptura de la lengua indígena (variante lingüística) de su contexto en su árbol genealógico."},{"clave":"LISL 2.1","texto":"Recupera información para llevar a cabo presentaciones orales y escritas en la lengua indígena (variante lingüística) del contexto, para describir rasgos étnicos, culturales e identitarios de los hablantes de esa lengua, como sus abuelos."}],"subcontenidos":[{"clave":"3.1","texto":"Los rasgos étnicos, culturales e identitarios."},{"clave":"3.2","texto":"El lenguaje a favor de la construcción de la identidad y del sentido de pertenencia."},{"clave":"3.3","texto":"La descripción textual como medio para reconocer lo común y lo diferente."}],"intencionesSubcontenidos":[{"clave":"3.1","texto":"Escuchar, mediante una entrevista personal, comentarios y explicaciones de algunas personas originarias de la comunidad sobre un evento cultural o festividad de la región, para conocer las manifestaciones de la identidad y sentido de pertenencia de las personas."},{"clave":"3.2","texto":"Mediante la elaboración de un objeto artesanal, analizar diferentes productos artesanales elaborados con diversos materiales para apreciar lo expresado en ellos. Compartir sentimientos y pensamientos propios con la finalidad de contribuir a la construcción crítica de la identidad personal, la identidad colectiva y el sentido de pertenencia."},{"clave":"3.3","texto":"Elaborar dos narraciones escritas u orales sobre el lugar donde viven y sobre alguna comunidad o pueblo originario cercano. Identificar en ellas expresiones sobre el sentido de pertenencia de ambas comunidades y realizar un cuadro comparativo para reconocer sus similitudes y diferencias."}]},"2":{"nombre":"3. La cultura como manifestación de la identidad y del sentido de pertenencia.","intencionDidacticaCI":"3. Reflexionar, en comunidad, acerca de la cultura y las características dinámicas de las lenguas como resultado de haber elaborado un libro álbum narrativo, un cuadro comparativo de variantes lingüísticas y un texto reflexivo.","disciplinas":[{"clave":"ESP 3","texto":"Las lenguas como manifestación de la identidad y del sentido de pertenencia."},{"clave":"LISL 2","texto":"La identidad y cultura de la lengua indígena (variante lingüística) del contexto escolar."},{"clave":"ING 2","texto":"La identidad y cultura de pueblos de habla inglesa."},{"clave":"LILM 3","texto":"Las lenguas indígenas como manifestación de la identidad y del sentido de pertenencia."},{"clave":"ART 3","texto":"Identidad y sentido de pertenencia en manifestaciones artísticas."}],"pda":[{"clave":"ESP 3.1","texto":"Comprende y redacta textos narrativos sobre la construcción de la identidad y el sentido de pertenencia, a partir del análisis de variantes del español."},{"clave":"LISL 2.1","texto":"Elabora fichas informativas en la lengua indígena (variante lingüística) del contexto, sobre rasgos identitarios de pueblos indígenas de México y el mundo (acento, grafía, vestimenta, comida, tradiciones y costumbres, entre otros)."},{"clave":"ING 2.1","texto":"Elabora fichas informativas en inglés sobre rasgos identitarios de pueblos de habla inglesa (acento, grafía, vestimenta, comida, tradiciones, costumbres, entre otros)."},{"clave":"LILM 3.1","texto":"Aprende y redacta textos, narrativos sobre la construcción de su identidad, personal y familiar, así como el sentido de pertenencia, a partir de las tensiones entre el español y la lengua (variante lingüística) indígena de su contexto."},{"clave":"ART 3.1","texto":"Reflexiona sobre la manera en que las artes fortalecen la identidad, dan sentido de pertenencia y resultan esenciales para favorecer la interculturalidad crítica."}],"subcontenidos":[{"clave":"3.1","texto":"La manifestación de la identidad y la cultura a través de las variantes del español en textos narrativos."},{"clave":"3.2","texto":"Los rasgos identitarios de hablantes de México y el mundo."},{"clave":"3.3","texto":"El diálogo intercultural a favor de la identidad y del sentido de pertenencia."}],"intencionesSubcontenidos":[{"clave":"3.1","texto":"Reconocer las variantes del español a través del diseño y escritura de un libro álbum narrativo para reflejar la identidad y el sentido de pertenencia de los hablantes."},{"clave":"3.2","texto":"Identificar los distintos rasgos identitarios de los hablantes a partir de la elaboración de un cuadro comparativo de variantes lingüísticas para reconocerlos."},{"clave":"3.3","texto":"Analizar las maneras en que los textos literarios y las artes favorecen el diálogo intercultural por medio de la redacción de un texto reflexivo para abordar el sentido de pertenencia y la identidad a través del lenguaje y sus variantes."}]},"3":{"nombre":"3. La cultura como manifestación de la identidad y del sentido de pertenencia.","intencionDidacticaCI":"3. Presentar manifestaciones culturales a través de un recital metalingüístico, una feria cultural y un reporte argumentativo para el fortalecimiento y promoción de la identidad y del sentido de pertenencia.","disciplinas":[{"clave":"ESP 3","texto":"Las lenguas como manifestación de la identidad y del sentido de pertenencia."},{"clave":"LISL 2","texto":"La identidad y cultura de la lengua indígena (variante lingüística) del contexto escolar."},{"clave":"ING 2","texto":"La identidad y cultura de pueblos de habla inglesa."},{"clave":"ART 3","texto":"Identidad y sentido de pertenencia en manifestaciones artísticas."},{"clave":"LILM 3","texto":"Las lenguas indígenas como manifestación de la identidad y del sentido de pertenencia."}],"pda":[{"clave":"ESP 3.1","texto":"Elabora textos argumentativos acerca de la interculturalidad crítica, para reconocer el valor de las lenguas, a fin de promoverlas y fortalecerlas."},{"clave":"LISL 2.1","texto":"Construye una propuesta de comunicación oral y escrita en la lengua indígena (variante lingüística) del contexto en la que contraste, valores y promueve rasgos de una sociedad intercultural."},{"clave":"ING 2.1","texto":"Construye una propuesta de comunicación en inglés, oral y escrita, donde contraste, valore y promueva rasgos de una sociedad intercultural identificados en pueblos de habla inglesa."},{"clave":"ART 3.1","texto":"Crea propuestas artísticas utilizando intencionalmente características de algunos estilos artísticos, a favor de la interculturalidad crítica, para fortalecer las identidades personal y colectiva."},{"clave":"LILM 3.1","texto":"Elabora textos argumentativo sobre la situación de las lenguas indígenas, en relación con el español y propone acciones para reconstruir la lealtad lingüística en las y los adolescentes indígenas."}],"subcontenidos":[{"clave":"3.1","texto":"La apreciación, reconocimiento y valoración de las lenguas en la identidad personal y colectiva."},{"clave":"3.2","texto":"La interculturalidad crítica en el fortalecimiento y promoción de las lenguas y el lenguaje artístico."},{"clave":"3.3","texto":"La situación de las lenguas indígenas con respecto a otras lenguas y acciones que fomentan su valoración."}],"intencionesSubcontenidos":[{"clave":"3.1","texto":"Organizar un recital metalingüístico para apreciar, reconocer, y valorar el impacto de las lenguas en la identidad personal y colectiva."},{"clave":"3.2","texto":"Exponer manifestaciones lingüísticas y artísticas de México y el mundo en una feria cultural para la promoción de las lenguas y el lenguaje artístico y el fortalecimiento de las sociedades interculturales y de la identidad."},{"clave":"3.3","texto":"Elaborar y presentar a la comunidad un reporte argumentativo sobre la situación que tienen las lenguas indígenas con respecto a otras lenguas, para promover acciones que las fortalezcan y valoren."}]}}},{"numero":4,"trimestre":1,"titulo":"4. El dinamismo de las lenguas y su relevancia en la conservación del patrimonio cultural de México y del mundo.","grados":{"1":{"nombre":"4. El dinamismo de las lenguas y su relevancia en la conservación del patrimonio cultural de México y del mundo.","intencionDidacticaCI":"4. Reconocerse como ciudadanas y ciudadanos que pueden ejercer su derecho a una vida digna, a decidir sobre su identidad personal y colectiva; así como a vivir con bienestar y buen trato en un marco de libertades y responsabilidades personales y con su comunidad, mediante la elaboración de un glosario de palabras del pasado, un catálogo lingüístico local y unas tarjetas reveladoras.","disciplinas":[{"clave":"ESP 4","texto":"El dinamismo de las lenguas y su relevancia como patrimonio cultural."},{"clave":"ING 4","texto":"Uso de diversos textos en inglés que promueven la preservación y conservación de las lenguas."},{"clave":"ART 4","texto":"Patrimonio cultural de la comunidad en manifestaciones que fomentan la identidad y el sentido de pertenencia."},{"clave":"LILM 4","texto":"El dinamismo de las lenguas indígenas y su relevancia como patrimonio cultural."},{"clave":"LISL 6","texto":"La lengua indígena (variante lingüística de su contexto) para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."}],"pda":[{"clave":"ESP 4.1","texto":"Identifica y expresa la relevancia de valorar las lenguas como legado de la comunidad."},{"clave":"ING 4.1","texto":"Recupera estrategias acerca de la conservación y preservación de las lenguas, planteadas en textos informativos y científicos en inglés, y las difunde."},{"clave":"ART 4.1","texto":"Interpreta manifestaciones artísticas del patrimonio cultural de la comunidad y de México, para fomentar la identidad personal y colectiva, así como el sentido de pertenencia."},{"clave":"LILM 4.1","texto":"Analiza en textos orales y/o escritos en la lengua indígena de su contexto, neologismos, juegos de lenguajes, caló, jerga, préstamos lingüísticos, extranjerismos como parte del dinamismo de las lenguas indígenas."},{"clave":"LISL 6.1","texto":"Llevar a cabo juegos de lenguaje en la lengua indígena (variante lingüística) de su contexto para expresar sensaciones, emociones, sentimientos e ideas sobre las familias y la escuela."}],"subcontenidos":[{"clave":"4.1","texto":"El dinamismo de las lenguas."},{"clave":"4.2","texto":"La trascendencia del legado lingüístico."},{"clave":"4.3","texto":"La importancia y valoración del patrimonio cultural."}],"intencionesSubcontenidos":[{"clave":"4.1","texto":"Investigar palabras que actualmente ya no se usen, para formar un glosario del pasado que se comparta en comunidad, para comprender el dinamismo de las lenguas."},{"clave":"4.2","texto":"Identificar palabras y expresiones que se usan para nombrar las cosas o los hechos del entorno inmediato y que son propias de la comunidad. Con ellas, elaborar un catálogo lingüístico local para valorar la importancia de seguir reconociendo las palabras que tienen origen en el lugar donde viven."},{"clave":"4.3","texto":"Diseñar tarjetas reveladoras que contengan información sobre neologismos, juegos de lenguajes, caló, jergas, préstamos lingüísticos, extranjerismos, que forman parte de alguna lengua indígena para entender los cambios en las lenguas y cómo es que forman parte del patrimonio cultural"}]},"2":{"nombre":"4. El dinamismo de las lenguas y su relevancia en la conservación del patrimonio cultural de México y del mundo.","intencionDidacticaCI":"4. Integrar las experiencias vividas en comunidad sobre el dinamismo de las lenguas y su relevancia en la conservación del patrimonio cultural de México y el mundo, como resultado de investigar y haber realizado pósteres monográficos ilustrados, una pintura mural y grabaciones en audio.","disciplinas":[{"clave":"ESP 4","texto":"El dinamismo de las lenguas y su relevancia como patrimonio cultural."},{"clave":"LILM 4","texto":"El dinamismo de las lenguas indígenas y su relevancia como patrimonio cultural."},{"clave":"ART 4","texto":"Patrimonio cultural de la comunidad en manifestaciones artísticas que fomentan la identidad y el sentido de pertenencia."},{"clave":"LISL 6","texto":"La lengua indígena (variante lingüística de su contexto) para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"ING 4","texto":"Uso de diversos textos en inglés que promueven la preservación y conservación de las lenguas."}],"pda":[{"clave":"ESP 4.1","texto":"Reconoce cambios temporales y geográficos del español en la comunidad, el país o el mundo hispano."},{"clave":"LILM 4.1","texto":"Reconoce cambios temporales y geográficos en la lengua indígena (variante lingüística) de su contexto en la comunidad, país y mundo."},{"clave":"ART 4.1","texto":"Expresa mediante lenguajes artísticos, la relevancia de valorar, conservar y preservar el patrimonio cultural, como legado que le otorga identidad y sentido de pertenencia."},{"clave":"LILM 4.2","texto":"Registra estos cambios a través de videos, audios, textos, poemas, cantos, entre otros."},{"clave":"LISL 6.1","texto":"Realiza entrevistas en la lengua indígena (variante lingüística) de su contexto para recuperar opiniones, acerca de emociones, sentimientos e ideas sobre la familia, la escuela y la comunidad."},{"clave":"ING 4.1","texto":"Indaga y construye propuestas en inglés para conservar y preservar las lenguas, como legado y sentido de pertenencia, y las difunde por algún medio de comunicación."}],"subcontenidos":[{"clave":"4.1","texto":"El cambio lingüístico a lo largo del tiempo y el espacio geográfico."},{"clave":"4.2","texto":"Los cambios lingüísticos por motivos geográficos en la comunidad, país y mundo."},{"clave":"4.3","texto":"La conservación del legado cultural a través de las lenguas y el lenguaje artístico."}],"intencionesSubcontenidos":[{"clave":"4.1","texto":"Investigar los cambios del español a través del tiempo y el espacio geográfico a partir de la elaboración de pósteres monográficos ilustrados para reconocer el valor de las lenguas como patrimonio cultural."},{"clave":"4.2","texto":"Crear una pintura mural que represente a las lenguas de México como un patrimonio cultural para valorar la identidad y sentido de pertenencia de su comunidad."},{"clave":"4.3","texto":"Registrar, por medio de grabaciones en audio, lecturas de textos literarios escritos en distintas lenguas de México y el mundo, para difundir en redes sociales la importancia de conservar el legado cultural y artístico de la riqueza plurilingüística."}]},"3":{"nombre":"4. El dinamismo de las lenguas y su relevancia en la conservación del patrimonio cultural de México y del mundo.","intencionDidacticaCI":"4. Reconocer el dinamismo de las lenguas a través de una línea del tiempo ilustrada, una muestra fotográfica y un periódico mural interactivo para la valoración y conservación del patrimonio cultural de México y del mundo.","disciplinas":[{"clave":"ESP 4","texto":"El dinamismo de las lenguas y su relevancia como patrimonio cultural."},{"clave":"LILM 4","texto":"El dinamismo de las lenguas indígenas y su relevancia como patrimonio cultural."},{"clave":"ING 4","texto":"Uso de diversos textos en inglés que promueven la preservación y conservación de las lenguas."},{"clave":"ART 4","texto":"Patrimonio cultural de la comunidad en manifestaciones artísticas que fomentan la identidad y el sentido de pertenencia."},{"clave":"LISL 6","texto":"La lengua indígena (variante lingüística de su contexto) para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."}],"pda":[{"clave":"ESP 4.1","texto":"Analiza textos literarios, neologismos, juegos de lenguajes, caló, jerga, préstamos, lingüísticos y extranjerismos, como parte del dinamismo de la lengua española."},{"clave":"LILM 4.1","texto":"Identifica y expresa el trayecto histórico que ha tenido la lengua indígena (variante lingüística) de su contexto y la relevancia de valorarla como legado de la comunidad."},{"clave":"ING 4.1","texto":"Participa en un debate en inglés sobre los cambios lingüísticos y culturales de las lenguas en el transcurso del tiempo, y su impacto en la conformación de nuevas prácticas sociales."},{"clave":"LILM 4.2","texto":"Comparte el legado usando un lenguaje artístico."},{"clave":"ART 4.1","texto":"Reinterpreta de manera respetuosa manifestaciones artísticas del patrimonio cultural, para valorar su identidad sentido de pertenencia."},{"clave":"LISL 6.1","texto":"Investiga y recupera manifestaciones culturales y artísticas de su comunidad indígena de origen para difundirlas en la lengua indígena (variante lingüística) de su contexto."}],"subcontenidos":[{"clave":"4.1","texto":"Los cambios lingüísticos y culturales, y su trayectoria histórica en México y el mundo."},{"clave":"4.2","texto":"La reinterpretación de las manifestaciones culturales y artísticas para la valoración de la identidad."},{"clave":"4.3","texto":"Los textos literarios y sus recursos como medio de expresión del dinamismo y conservación de las lenguas."}],"intencionesSubcontenidos":[{"clave":"4.1","texto":"Identificar y registrar la trayectoria histórica de las lenguas y culturas en una línea del tiempo ilustrada para descubrir los cambios del patrimonio cultural de México y del mundo."},{"clave":"4.2","texto":"Reinterpretar y diseñar distintas manifestaciones culturales y artísticas en una muestra fotográfica para evaluar su impacto en la identidad personal y colectiva."},{"clave":"4.3","texto":"Reconocer en textos literarios en diversas lenguas y a través de un periódico mural interactivo cómo se expresa el dinamismo de las lenguas para comprender su relevancia en la conservación del patrimonio cultural."}]}}},{"numero":5,"trimestre":1,"titulo":"5. La lengua y los lenguajes artísticos y su relación con las necesidades, intereses y problemas de la comunidad.","grados":{"1":{"nombre":"5. La lengua y los lenguajes artísticos y su relación con las necesidades, intereses y problemas de la comunidad.","intencionDidacticaCI":"5. Identificar y resolver problemas a partir de las experiencias y vivencias de otras comunidades y desarrollar habilidades, mediante la redacción de una historia con solución, la organización de una asamblea reveladora y un encuentro breve, para trabajar en comunidades, comunicarse de manera efectiva y crear soluciones innovadoras.","disciplinas":[{"clave":"ESP 5","texto":"La función creativa del español en la expresión de necesidades e intereses comunitarios."},{"clave":"ING 5","texto":"El uso del inglés para expresar necesidades, intereses y problemas de la comunidad."},{"clave":"ART 5","texto":"Los lenguajes artísticos en la expresión de problemas de la comunidad."},{"clave":"LILM 13","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales que se consideren relevantes."},{"clave":"LISL 4","texto":"El uso de la lengua indígena (variante lingüística) del contexto para expresar necesidades, intereses y problemas de la comunidad."}],"pda":[{"clave":"ESP 5.1","texto":"Identifica una situación problemática de la comunidad, haciendo uso del pensamiento crítico, para plantear diversas formas creativas de resolverla, por ejemplo, con un cuento."},{"clave":"ING 5.1","texto":"Investiga en textos en inglés soluciones implementadas sobre problemas de una comunidad, e informa de manera oral o escrita sus hallazgos."},{"clave":"ART 5.1","texto":"Usa intencionalmente formas, colores, movimientos y sonidos, entre otros elementos de las artes, para recrear una situación problemática de su contexto y manifestar una postura crítica."},{"clave":"LILM 13.1","texto":"Conoce y usa la lengua indígena (variante lingüística) del contexto."},{"clave":"LISL 4.1","texto":"Investiga en textos soluciones implementadas sobre problemas de una comunidad e informa de manera oral o escrita sus hallazgos en la lengua indígena (variante lingüística) del contexto."}],"subcontenidos":[{"clave":"5.1","texto":"El pensamiento crítico en la identificación de problemáticas comunitarias."},{"clave":"5.2","texto":"El uso de la lengua oral o escrita en la difusión de problemas de la comunidad."},{"clave":"5.3","texto":"Soluciones creativas a problemáticas del entorno."}],"intencionesSubcontenidos":[{"clave":"5.1","texto":"Presentar narraciones sobre alternativas de solución a problemáticas comunitarias referenciadas en un escrito. Realizar una historia con solución en la que se identifiquen aquellos elementos del pensamiento crítico que las fundamentan."},{"clave":"5.2","texto":"Redactar varios textos expositivos que muestren de manera objetiva y precisa acontecimientos de la comunidad donde viven, para organizar una asamblea reveladora y mostrar el uso del lenguaje oral o escrito en la difusión y reflexión de problemas comunitarios."},{"clave":"5.3","texto":"Seleccionar un texto literario o informativo que exprese la forma cómo se resuelve una determinada situación en una comunidad, para realizar un encuentro breve en el cual se visualicen posibilidades de atención a otras problemáticas del entorno."}]},"2":{"nombre":"5. La lengua y los lenguajes artísticos y su relación con las necesidades, intereses y problemas de la comunidad.","intencionDidacticaCI":"Investigar sobre acciones colectivas que posibiliten la solución de problemas, necesidades e intereses de la comunidad a través de la elaboración de un mapa mental tridimensional, un ensayo poético y un cartel informativo tipo collage.","disciplinas":[{"clave":"LISL 4","texto":"El uso de la lengua indígena (variante lingüística) del contexto para expresar necesidades, intereses y problemas de la comunidad."},{"clave":"ING 5","texto":"El uso del inglés para expresar necesidades, intereses y problemas de la comunidad."},{"clave":"ESP 5","texto":"La función creativa del español en la expresión de necesidades e intereses comunitarios."},{"clave":"ART 5","texto":"Los lenguajes artísticos en la expresión de problemas de la comunidad."}],"pda":[{"clave":"LISL 4.1","texto":"Elabora escritos argumentativo en la lengua indígena (variante lingüística) del contexto que propongan acciones colectivas y que posibiliten la solución de problemas de una comunidad."},{"clave":"ING 5.1","texto":"Elabora escritos argumentativo en inglés sobre acciones colectivas que posibiliten la solución de problemas de una comunidad."},{"clave":"ESP 5.1","texto":"Expresa, mediante un ensayo, una postura crítica sobre necesidades, intereses y problemas de la comunidad."},{"clave":"ART 5.1","texto":"Investiga propuestas artísticas colectivas de entornos rurales y urbanos a favor de la inclusión, para presentar una postura crítica sobre un problema de la comunidad."}],"subcontenidos":[{"clave":"5.1","texto":"La expresión de una postura crítica sobre necesidades y problemas comunitarios a través de la lengua y las artes."},{"clave":"5.2","texto":"El ensayo como medio de expresión de posturas críticas sobre necesidades e intereses de la comunidad."},{"clave":"5.3","texto":"La investigación de acciones colectivas a favor de la inclusión."}],"intencionesSubcontenidos":[{"clave":"5.1","texto":"Elaborar un mapa mental tridimensional en distintas lenguas sobre acciones colectivas para la solución de problemas de una comunidad."},{"clave":"5.2","texto":"Analizar a través de un ensayo poético problemas, necesidades e intereses de la comunidad para ofrecer una postura crítica."},{"clave":"5.3","texto":"Investigar acciones comunitarias o de otras regiones que promuevan la inclusión mediante un cartel informativo tipo collage para difundir la solución de problemas comunitarios con una postura crítica."}]},"3":{"nombre":"5. La lengua y los lenguajes artísticos y su relación con las necesidades, intereses y problemas de la comunidad.","intencionDidacticaCI":"5. Hacer uso de la lengua y los lenguajes artísticos en un catálogo ilustrado, una historieta costumbrista, y una tertulia artística para identificar las necesidades, intereses y problemas de la comunidad.","disciplinas":[{"clave":"LISL 4","texto":"El uso de la lengua indígena (variante lingüística) del contexto para expresar necesidades, intereses y problemas de la comunidad."},{"clave":"ING 5","texto":"El uso del inglés para expresar necesidades, intereses y problemas de la comunidad."},{"clave":"ESP 5","texto":"La función creativa del español en la expresión de necesidades e intereses comunitarios."},{"clave":"LILM 13","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales que se consideren relevantes."},{"clave":"ART 5","texto":"Los lenguajes artísticos en la expresión de problemas de la comunidad."}],"pda":[{"clave":"LISL 4.1","texto":"Organiza una campaña en la lengua indígena (variante lingüística) del contexto sobre soluciones a problemas de la comunidad."},{"clave":"ING 5.1","texto":"Organiza una campaña en inglés sobre soluciones a problemas de la comunidad."},{"clave":"ESP 5.1","texto":"Crea textos literarios de distintos géneros para ofrecer una propuesta de solución a problemas de la comunidad."},{"clave":"LILM 13.1","texto":"Produce y recrea textos en la lengua indígena (variante lingüística) del contexto sobre la práctica social relevante."},{"clave":"ART 5.1","texto":"Experimenta con técnicas artísticas y elige una que implemente en un proyecto escolar creativo, para imaginar y proponer posibles soluciones a problemas de la comunidad."}],"subcontenidos":[{"clave":"5.1","texto":"Las propuestas creativas y artísticas en la solución de problemas de la comunidad."},{"clave":"5.2","texto":"El texto literario como medio para ofrecer soluciones y exponer prácticas sociales."},{"clave":"5.3","texto":"Los lenguajes artísticos y la expresión de los intereses de la comunidad."}],"intencionesSubcontenidos":[{"clave":"5.1","texto":"Diseñar, a través de propuestas creativas y en distintos lenguajes, un catálogo ilustrado para solucionar problemas comunitarios."},{"clave":"5.2","texto":"Crear una historieta costumbrista, en distintas lenguas, que exponga prácticas y problemas sociales de la comunidad para ofrecer soluciones."},{"clave":"5.3","texto":"Llevar a cabo un encuentro artístico para exponer los diversos problemas e intereses culturales y artísticos de la comunidad."}]}}},{"numero":6,"trimestre":2,"titulo":"6. La función creativa de las lenguas y las artes a través sus elementos y recursos.","grados":{"1":{"nombre":"6. La función creativa de las lenguas y las artes a través sus elementos y recursos.","intencionDidacticaCI":"6. Rescatar, a través de un glosario bilingüe, un cuadro con columnas y una tertulia artística, el valor de distintas lenguas para promover el interés de adquirir nuevos lenguajes que permitan la comunicación en lugares diferentes.","disciplinas":[{"clave":"ESP 5","texto":"La función creativa del español en la expresión de necesidades e intereses comunitarios."},{"clave":"ING 6","texto":"Elementos y recursos estéticos del inglés."},{"clave":"ART 6","texto":"Elementos de las artes y recursos estéticos apreciados en el entorno natural y social, así como en diversas manifestaciones artísticas."},{"clave":"LILM 14","texto":"Estudio de la lengua indígena (variante lingüística) del contexto en sus componentes estructurales."}],"pda":[{"clave":"ESP 5.1","texto":"Identifica una situación problemática de la comunidad, haciendo uso del pensamiento crítico, para plantear diversas formas creativas de resolverla, por ejemplo, con un cuento."},{"clave":"ING 6.1","texto":"Recupera de distintos tipos de textos literarios en inglés, expresiones, elementos y recursos estéticos y elabora un glosario."},{"clave":"ART 6.1","texto":"Identifica el uso intencional del cuerpo, del espacio y del tiempo en manifestaciones artísticas, para apreciar e interpretar sus sentidos y significados."},{"clave":"LILM 14.1","texto":"Conoce y reflexiona sobre los componentes de la lengua indígena (variante lingüística) del contexto en los planos: fonético fonológico, morfológico, sintáctico, semántico y pragmático de la lengua indígena."}],"subcontenidos":[{"clave":"6.1","texto":"La función creativa y lúdica de las lenguas: juegos del lenguaje."},{"clave":"6.2","texto":"Los recursos lingüísticos de los textos orales y/o escritos."},{"clave":"6.3","texto":"Los elementos y recursos estéticos de las artes."}],"intencionesSubcontenidos":[{"clave":"6.1","texto":"Realizar un glosario bilingüe con juegos del lenguaje o expresiones estéticas extraídos desde distintos textos breves en inglés que contengan algunas expresiones, elementos y recursos estéticos que evidencien la función creativa y lúdica de las lenguas."},{"clave":"6.2","texto":"Elaborar en pequeñas comunidades un cuadro con columnas donde se muestren algunas variantes y recursos lingüísticos de las lenguas originarias, considerando sus componentes fonéticos, fonológicos, sintácticos, semánticos y pragmáticos. Para esto, seleccionar algunos textos informativos escritos en dichas lenguas."},{"clave":"6.3","texto":"Organizar una tertulia artística sobre la riqueza pluricultural de México y el mundo, con la intención de valorar diversas manifestaciones artísticas expresadas a través del uso del cuerpo, del espacio y del tiempo."}]},"2":{"nombre":"6. La función creativa de la literatura, las lenguas y las artes a través de sus elementos y recursos.","intencionDidacticaCI":"6. Reflexionar sobre los elementos y recursos de la lengua y los lenguajes a través de una declamación dramatizada, un poemario con viñetas y una muestra escénica mediante el uso de la función creativa.","disciplinas":[{"clave":"ESP 6","texto":"Los elementos y los recursos estéticos de la lengua española en la literatura oral y escrita."},{"clave":"ING 6","texto":"Elementos y recursos estéticos del inglés."},{"clave":"ART 6","texto":"Elementos de las artes y recursos estéticos apreciados en el entorno natural y social, así como en diversas manifestaciones artísticas."},{"clave":"LILM 7","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la tierra como madre y como territorio II."}],"pda":[{"clave":"ESP 6.1","texto":"Analiza las características y recursos estéticos de los textos narrativos, e interpreta y disfruta de cuentos y novelas."},{"clave":"ING 6.1","texto":"Identifica y explica el uso de expresiones, elementos y recursos estéticos en manifestaciones culturales y artísticas de países de habla inglesa."},{"clave":"ART 6.1","texto":"Analiza el uso intencional de elementos de las artes como ritmo, repetición, armonía, contraste y variación, en manifestaciones artísticas, para emplearlos en una creación personal."},{"clave":"LILM 7.1","texto":"Identifica y analiza características y recursos estéticos de la lengua indígena (variante lingüística) del contexto, en la producción de textos orales de distintos géneros en torno a la tierra como madre y como territorio."},{"clave":"ART 6.2","texto":"Reinterpreta los sentidos y significados de las cualidades estéticas del entorno natural y social en creaciones artísticas personales."}],"subcontenidos":[{"clave":"6.1","texto":"Las características y recursos estéticos del español en textos literarios, orales y escritos."},{"clave":"6.2","texto":"El uso intencional de los elementos y recursos estéticos."},{"clave":"6.3","texto":"El manejo de la función creativa para explorar temas de la naturaleza y sociedad."}],"intencionesSubcontenidos":[{"clave":"6.1","texto":"Explorar e interpretar a través de la función creativa del español textos literarios (narrativos), orales y escritos mediante una declamación dramatizada para fortalecer sus habilidades lectoras y memorización."},{"clave":"6.2","texto":"Reconocer el uso intencional de los elementos y recursos estéticos de diversos lenguajes a través de un poemario con viñetas para incentivar la creación literaria y artística."},{"clave":"6.3","texto":"Adaptar un texto literario (leyenda, mito o cuento corto con origen oral) en la lengua indígena en una muestra escénica para explorar temas en torno a la tierra como madre y como territorio."}]},"3":{"nombre":"6. La función creativa de la literatura, las lenguas y las artes a través sus elementos y recursos.","intencionDidacticaCI":"6. Identificar y usar creativamente las funciones y recursos de la lengua y las artes por medio de un desfile dramatizado de carteles gráficos, un poemario creativo y un collage comentado con fotografías para aprovechar los elementos y recursos de las lenguas.","disciplinas":[{"clave":"ESP 6","texto":"Los elementos y los recursos estéticos de la lengua española en la literatura oral y escrita."},{"clave":"LILM 14","texto":"Estudio de la lengua indígena (variante lingüística) del contexto en sus componentes estructurales."},{"clave":"ING 6","texto":"Elementos y recursos estéticos del inglés."},{"clave":"ART 6","texto":"Elementos de las artes y recursos estéticos apreciados en el entorno natural y social, así como en diversas manifestaciones artísticas."}],"pda":[{"clave":"ESP 6.1","texto":"Usa creativa e intencionalmente las características y los recursos estéticos de textos dramáticos, para escenificar situaciones vinculadas con la comunidad."},{"clave":"LILM 14.1","texto":"Conoce y reflexiona sobre los componentes de la lengua indígena (variante lingüística) del contexto en los planos: fonético-fonológico, morfológico, sintáctico, semántico y pragmático de la lengua indígena"},{"clave":"ING 6.1","texto":"Emplea algunas figuras retóricas, elementos y recursos estéticos, para construir un texto literario corto, oral y escrito, para difundirlo en la comunidad escolar."},{"clave":"ART 6.1","texto":"Usa intencionalmente figuras retóricas como metáforas, hipérboles, sinécdoques, aliteraciones, en creaciones artísticas colectivas, para representar situaciones vinculadas a la comunidad."},{"clave":"ART 6.2","texto":"Interviene el entorno natural y social, mediante el uso de los lenguajes artísticos, para expresar un mensaje a favor del cuidado del medio ambiente."}],"subcontenidos":[{"clave":"6.1","texto":"La aplicación de recursos dramáticos de la lengua y estéticos del arte en distintos ámbitos de la vida cotidiana."},{"clave":"6.2","texto":"Los componentes estructurales de la lengua, y su adaptación creativa en las expresiones comunicativas."},{"clave":"6.3","texto":"Las figuras retóricas en el arte y la vida cotidiana."}],"intencionesSubcontenidos":[{"clave":"6.1","texto":"Aplicar la función creativa de la lengua y el arte en un desfile dramatizado de carteles gráficos para representar los distintos ámbitos de la vida cotidiana."},{"clave":"6.2","texto":"Identificar y aprovechar los componentes estructurales de la lengua en la adaptación de un poemario creativo para comprender las variantes lingüísticas."},{"clave":"6.3","texto":"Elaborar un collage comentado con fotografías para identificar las figuras retóricas en los lenguajes artísticos e inglés presentes en la vida cotidiana."}]}}},{"numero":7,"trimestre":2,"titulo":"7. Los elementos y recursos estéticos de las manifestaciones culturales, lingüísticas y artísticas.","grados":{"1":{"nombre":"7. Los elementos y recursos estéticos de las manifestaciones culturales, lingüísticas y artísticas.","intencionDidacticaCI":"7. Explorar las manifestaciones culturales y artísticas de diferentes sociedades, mediante la elaboración de láminas ilustrativas, un mural de dibujos y un coloquio, para reconocer la diversidad cultural y su importancia en la vida cotidiana.","disciplinas":[{"clave":"ESP 6","texto":"Los elementos y los recursos estéticos de la lengua española en la literatura oral y escrita."},{"clave":"ING 6","texto":"Elementos y recursos estéticos del inglés."},{"clave":"ING 7","texto":"Manifestaciones artísticas y culturales del inglés."},{"clave":"ART 7","texto":"Valor estético de la naturaleza, de la vida cotidiana y diferentes manifestaciones culturales y artísticas."},{"clave":"LISL 12","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante, ya sea de la comunidad de origen o de nuevas prácticas III."}],"pda":[{"clave":"ESP 6.1","texto":"Reconoce los recursos estéticos en textos literarios líricos, orales y escritos, y disfruta de poemas, canciones, juegos de palabras, entre otros."},{"clave":"ING 6.1","texto":"Recupera de distintos tipos de textos literarios en inglés, expresiones, elementos y recursos estéticos y elabora un glosario."},{"clave":"ING 7.1","texto":"Realiza una lectura crítica y emite su opinión en inglés sobre diversas manifestaciones culturales y artísticas de pueblos de habla inglesa."},{"clave":"ART 7.1","texto":"Disfruta de manifestaciones culturales y artísticas de la comunidad y de otros lugares, para reconocer sus gustos e intereses estéticos."},{"clave":"ART 7.2","texto":"Disfruta de los valores estéticos presentes en la naturaleza para apreciarla y expresarla."},{"clave":"LISL 12.1","texto":"Realiza una lectura crítica y emite su opinión en la lengua indígena (variante lingüística) del contexto respecto a la práctica cultural relevante."}],"subcontenidos":[{"clave":"7.1","texto":"Los recursos estéticos de la lengua en textos líricos, orales y escritos y su lectura."},{"clave":"7.2","texto":"Los valores estéticos de las manifestaciones artísticas y culturales presentes en el entorno."},{"clave":"7.3","texto":"Los recursos y elementos de la lengua en actividades lúdicas y creativas."}],"intencionesSubcontenidos":[{"clave":"7.1","texto":"Investigar el significado de diversos recursos estéticos de la lengua presentes en algunos textos literarios para, posteriormente, localizarlos en otros textos líricos en español y en inglés, y finalizar con una presentación a la comunidad mediante la elaboración de láminas ilustrativas."},{"clave":"7.2","texto":"Realizar de forma individual un dibujo de algún espacio o manifestación artística del contexto en el que viven para integrar un mural de dibujos. Posteriormente, explicar qué elementos artísticos se tomaron en cuenta para expresar los valores estéticos del contexto observado."},{"clave":"7.3","texto":"Localizar ejemplos de manifestaciones artísticas relacionadas con el juego en diferentes culturas. Explicar, por medio de un coloquio, cómo el juego refleja lo relevante de la comunidad que lo practica."}]},"2":{"nombre":"7. Los elementos y recursos estéticos de las manifestaciones culturales, lingüísticas y artísticas.","intencionDidacticaCI":"7. Reconocer, en comunidad, los elementos y recursos estéticos de las manifestaciones culturales, lingüísticas y artísticas a través de la participación en un recital de poemas de autores locales y otros; un encuentro de lectores y una exhibición de arte.","disciplinas":[{"clave":"ESP 7","texto":"Textos literarios escritos en español o traducidos."},{"clave":"ING 7","texto":"Manifestaciones artísticas y culturales del inglés."},{"clave":"LISL 12","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante, ya sea de la comunidad de origen o de nuevas prácticas III."},{"clave":"ART 7","texto":"Valor estético de la naturaleza, de la vida cotidiana y de diferentes manifestaciones culturales y artísticas."}],"pda":[{"clave":"ESP 7.1","texto":"Analiza diversos textos literarios de su elección para expresar un juicio estético y lo comparte en la comunidad."},{"clave":"ING 7.1","texto":"Selecciona alguna manifestación artística o cultural y la difunde en inglés, mediante diversos elementos y recursos artísticos."},{"clave":"LISL 12.1","texto":"Investiga y difunde en lengua indígena (variante lingüística) del contexto su lectura crítica de la práctica cultural relevante."},{"clave":"ART 7.1","texto":"Investiga diversas manifestaciones culturales y artísticas para expresar un juicio estético y lo difunde en la comunidad escolar."}],"subcontenidos":[{"clave":"7.1","texto":"La valoración de las características y recursos estéticos del texto literario."},{"clave":"7.2","texto":"La interpretación de manifestaciones artísticas y culturales en el cuento y la novela."},{"clave":"7.3","texto":"La difusión y crítica de las manifestaciones culturales para su difusión."}],"intencionesSubcontenidos":[{"clave":"7.1","texto":"Reconocer y apreciar las características y recursos literarios a fin de embellecer un texto en el recital poético de autores locales u otros de su interés para expresar ante la comunidad un juicio estético."},{"clave":"7.2","texto":"Reconocer en textos narrativos en inglés características artísticas y culturales en un encuentro de lectores para la difusión de elementos y recursos artísticos."},{"clave":"7.3","texto":"Ampliar el bagaje cultural, lingüístico y artístico para emitir un juicio estético y crítico mediante una exhibición de arte que se compartirá con la familia y la comunidad."}]},"3":{"nombre":"7. Los elementos y recursos estéticos de las manifestaciones culturales, lingüísticas y artísticas.","intencionDidacticaCI":"7. Explorar y aplicar los elementos y recursos estéticos en un poema colaborativo, un ensayo con emojis y una canción colectiva para reconocer su uso en las manifestaciones culturales, lingüísticas y artísticas.","disciplinas":[{"clave":"LILM 5","texto":"Creaciones literarias tradicionales contemporáneas en la lengua indígena (variante lingüística) de su contexto."},{"clave":"LISL 12","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante, ya sea de la comunidad de origen o de nuevas prácticas III."},{"clave":"ING 7","texto":"Manifestaciones artísticas y culturales del inglés."},{"clave":"ART 7","texto":"Valor estético de la naturaleza, de la vida cotidiana y de diferentes manifestaciones culturales y artísticas."},{"clave":"ESP 7","texto":"Textos literarios escritos en español o traducidos."}],"pda":[{"clave":"LILM 5.1","texto":"Crea textos narrativos, poéticos, dramáticos y guiones para audiovisuales, entre otros, a partir del uso de recursos literarios, para exponer una situación real o ficticia en la lengua indígena (variante lingüística) de su contexto."},{"clave":"LISL 12.1","texto":"Crea textos breves en la lengua indígena (variante lingüística) del contexto, en torno a la práctica cultural que se considera relevante."},{"clave":"ING 7.1","texto":"Crea poemas cortos a partir del uso de recursos estéticos del inglés en producciones orales y escritas, para difundirse en la comunidad escolar."},{"clave":"ESP 7.1","texto":"Elabora un ensayo acerca del tratamiento de un tema de su elección, con base en algún género literario de su preferencia, para argumentar un juicio estético sobre éste."},{"clave":"ART 7.1 y 7.2","texto":"Identifica algunas categorías estéticas como lo bello, lo sublime, lo grotesco, lo trágico, lo cómico y lo siniestro, al apreciarlas en manifestaciones culturales y artísticas, para argumentar sus juicios estéticos y difundirlos en la comunidad. Identifica algunas categorías estéticas como lo bello, lo sublime, lo grotesco, lo trágico, lo cómico y lo siniestro, al apreciarlas en la naturaleza en la vida cotidiana, para compartir sus juicios estéticos y difundirlos en la comunidad."}],"subcontenidos":[{"clave":"7.1","texto":"Los recursos estéticos y literarios en la expresión de situaciones vinculadas a la comunidad."},{"clave":"7.2","texto":"La identificación de categorías estéticas, el juicios estéticos y su difusión."},{"clave":"7.3","texto":"Los recursos estéticos y las manifestaciones culturales de la comunidad."}],"intencionesSubcontenidos":[{"clave":"7.1","texto":"Hacer uso de los recursos estéticos y literarios en la redacción de un poema colaborativo en distintas lenguas sobre su entorno para expresar situaciones vinculadas a la comunidad."},{"clave":"7.2","texto":"Evaluar alguna manifestación artística o texto literario y redactar un ensayo con emojis para representar e identificar el valor de las categorías estéticas y los juicios estéticos."},{"clave":"7.3","texto":"Componer una canción colectiva para exponer los recursos estéticos de las manifestaciones culturales locales."}]}}},{"numero":8,"trimestre":2,"titulo":"8. El valor estético de los textos literarios.","grados":{"1":{"nombre":"8. El valor estético de los textos literarios.","intencionDidacticaCI":"8. Describir los recursos estilísticos que usan las y los escritores en sus obras. Conocer el valor estético de los textos literarios y desarrollar propuestas para incentivar la lectura por medio de la realización de fichas informativas, un poemario personal y un guion para la conversación.","disciplinas":[{"clave":"ESP 7","texto":"Textos literarios escritos en español o traducidos."},{"clave":"ING 8","texto":"Creaciones literarias tradicionales y contemporáneas en inglés."}],"pda":[{"clave":"ESP 7.1","texto":"Reconoce el valor estético de diversos géneros literarios en textos de su elección, para elaborar comentarios y promover su lectura."},{"clave":"ING 8.1","texto":"Selecciona textos literarios en inglés que aborden temas de la comunidad o de algún lugar de interés, los resume y difunde por distintos medios."}],"subcontenidos":[{"clave":"8.1","texto":"El valor estético de los géneros literarios."},{"clave":"8.2","texto":"La libre elección de textos literarios"},{"clave":"8.3","texto":"El comentario de textos literarios y la promoción de su lectura."}],"intencionesSubcontenidos":[{"clave":"8.1","texto":"Elaborar fichas informativas provenientes de diversas fuentes con el fin de conocer y compartir sus hallazgos respecto a los recursos estilísticos usados por las y los escritores en sus obras. Descubrir que todas y todos tienen la capacidad de utilizar dichos recursos para expresar opiniones, sentimientos y/o emociones y efectuar una valoración estética de los textos literarios."},{"clave":"8.2","texto":"Elaborar un poemario personal con ejemplos de textos líricos escritos en diferentes lenguas con el fin de destacar y reconocer el valor estético de este género literario. Compartir con la comunidad su búsqueda y la compilación final de los distintos textos utilizados en el poemario."},{"clave":"8.3","texto":"Elaborar un guion para la conversación utilizando las características de los recursos estilísticos, con el fin de dirigir una conversación donde se promueva la lectura de diversos textos literarios."}]},"2":{"nombre":"8. El valor estético de los textos literarios.","intencionDidacticaCI":"8. Representar las realidades de otros pueblos mediante un museo vivo, un videoblog cuentacuentos y un catálogo de artesanías para emitir juicios estéticos, conocer las formas de vida de otros pueblos y su relevancia cultural.","disciplinas":[{"clave":"ESP 8","texto":"Creaciones literarias tradicionales y contemporáneas."},{"clave":"LISL 13","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considera relevante, ya sea de la comunidad, de origen o de nuevas prácticas IV."},{"clave":"ING 8","texto":"Creaciones literarias tradicionales y contemporáneas en inglés."},{"clave":"ART 7","texto":"Valor estético de la naturaleza, de la vida cotidiana y de diferentes manifestaciones culturales y artísticas."}],"pda":[{"clave":"ESP 8.1","texto":"Valora textos literarios tradicionales y contemporáneos, como cuentos, novelas, poemas y textos dramáticos; los adapta a otros lenguajes para sensibilizar a la comunidad acerca de la relevancia social y cultural de la literatura."},{"clave":"LISL 13.1","texto":"Investiga y narra sucesos significativos en torno a las prácticas culturales de la lengua indígena (variante lingüística) del contexto."},{"clave":"ING 8.1","texto":"Investiga en textos literarios en inglés sobre pueblos indígenas y/o afrodescendientes de México o el mundo."},{"clave":"ING 8.2","texto":"Elabora por escrito una apreciación sobre la relevancia y el valor social y cultural de los pueblos indígenas y/o afrodescendientes de México o el mundo."},{"clave":"ART 7.2","texto":"Emite un juicio estético sobre un episodio significativo de la vida cotidiana y lo difunde en la comunidad."}],"subcontenidos":[{"clave":"8.1","texto":"La relevancia y el valor social y cultural de la literatura tradicional y contemporánea."},{"clave":"8.2","texto":"La relevancia social y cultural de los textos literarios sobre la identidad personal y colectiva de los pueblos."},{"clave":"8.3","texto":"El juicio estético en la vida cotidiana."}],"intencionesSubcontenidos":[{"clave":"8.1","texto":"Adaptar obras literarias de diversas épocas, géneros y culturas a otros lenguajes y representarlos realizando un museo vivo, para sensibilizar sobre la relevancia social y cultural de la literatura."},{"clave":"8.2","texto"
