:"Desarrollar un videoblog cuenta cuentos en distintas lenguas sobre historias que aborden la identidad personal y colectiva en los pueblos indígenas y afrodescendientes para señalar su relevancia social y cultural."},{"clave":"8.3","texto":"Elaborar un catálogo de artesanías de la vida cotidiana emitiendo un juicio estético para compartirlo con la comunidad."}]},"3":{"nombre":"8. El valor estético de los textos literarios","intencionDidacticaCI":"8. Hacer uso de los distintos géneros literarios y recursos estéticos en la creación de una antología exploratoria, una pieza teatral y una pequeña colección de textos en inglés para distinguir el valor estético de los textos literarios.","disciplinas":[{"clave":"ESP 8","texto":"Creaciones literarias tradicionales y contemporáneas."},{"clave":"ING 8","texto":"Creaciones literarias tradicionales y contemporáneas en inglés."},{"clave":"ART 8","texto":"Creaciones artísticas que tienen su origen en textos literarios."},{"clave":"LILM 6","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el territorio como espacio vital I."}],"pda":[{"clave":"ESP 8.1","texto":"Crea textos, narrativos, poéticos, dramáticos, y guiones audiovisuales, entre otros, a partir del uso de recursos literarios, para exponer una situación real o ficticia."},{"clave":"LILM 6.1","texto":"Crea textos literarios de distintos géneros o grabación de estos, en torno a las prácticas sociales relacionadas con el territorio y el uso de la lengua indígena (variante lingüística) en tales textos."},{"clave":"ING 8.1","texto":"Crea textos breves en inglés para exponer una situación o tema de interés con recursos narrativos, poéticos, visuales, escénicos o musicales."},{"clave":"ART 8.1","texto":"Construye una narrativa personal o colectiva, a partir de un texto literario de su interés, empleando en forma artística cuerpo, espacio y tiempo,"}],"subcontenidos":[{"clave":"8.1","texto":"Los recursos literarios en textos de distintos géneros."},{"clave":"8.2","texto":"El uso de recursos estéticos en la creación de textos de un tema de interés."},{"clave":"8.3","texto":"El valor estético de los textos literarios y las prácticas sociales."}],"intencionesSubcontenidos":[{"clave":"8.1","texto":"Crear una antología exploratoria con textos literarios originales de distintos géneros para exponer una situación real o ficticia."},{"clave":"8.2","texto":"Escenificar una pieza teatral a partir de un guion original en distintas lenguas que utilice recursos narrativos, poéticos, visuales, escénicos o musicales para exponer un tema de interés común."},{"clave":"8.3","texto":"Elaborar una pequeña colección de textos en lenguas indígenas para comentar la diversidad de prácticas sociales de su comunidad."}]}}},{"numero":9,"trimestre":2,"titulo":"9. Las creaciones artísticas y literarias tradicionales y contemporáneas relacionadas con la comunidad.","grados":{"1":{"nombre":"9. Las creaciones artísticas y literarias tradicionales y contemporáneas relacionadas con la comunidad.","intencionDidacticaCI":"9. Mirar, escuchar y sentir utilizando como medio el arte; así como traducir desde la lengua materna a una segunda lengua -el español o una lengua indígena- e inclusive a una tercera lengua extranjera como el inglés. Difundir y recuperar desde el lugar donde viven las obras de arte literario y artistas clásicos y contemporáneos, a través de una antología literaria, la selección de una colección de textos en inglés y un póster.","disciplinas":[{"clave":"ESP 8","texto":"Creaciones literarias tradicionales y contemporáneas."},{"clave":"ING 8","texto":"Creaciones literarias tradicionales y contemporáneas en inglés."},{"clave":"ART 8","texto":"Creaciones artísticas que tienen su origen en textos literarios."},{"clave":"LILM 5","texto":"Creaciones literarias tradicionales y contemporáneas en la lengua indígena (variante lingüística) de su contexto."},{"clave":"LILM 9","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el trabajo comunitario (tequio) como construcción de relaciones sociales II"},{"clave":"LISL 5","texto":"Creaciones literarias tradicionales y contemporáneas en la lengua indígena (variante lingüística) de su contexto."}],"pda":[{"clave":"ESP 8.1","texto":"Recupera y clasifica creaciones literarias de la comunidad o de un lugar de interés, como mitos, leyendas, fábulas, epopeyas, cantares de gesta, refranes, coplas, canciones, corridos, juegos de palabras, para promover de manera creativa su lectura."},{"clave":"ING 8.1","texto":"Selecciona textos literarios en inglés que aborden temas de la comunidad o de algún lugar de interés, los resume y difunde por distintos medios."},{"clave":"ART 8.1","texto":"Explora con formas, colores, movimientos, sonidos, entre otros elementos de las artes, para reinterpretar textos literarios de la comunidad u otros lugares, haciendo uso de diversos lenguajes artísticos."},{"clave":"LILM 5.1","texto":"Recupera y clasifica creaciones literarias de la comunidad o de un lugar de interés, como poemas, mitos, leyendas, fábulas, epopeyas, cantares de gesta, refranes, coplas, canciones, corridos, juegos de palabras, entre otras, para promover de manera creativa su lectura."},{"clave":"LILM 9.1","texto":"Recupera y clasifica mitos, leyendas, fábulas, epopeyas, consejos, dichos, coplas, canciones, corridos y juegos de palabras, entre otros, en torno al trabajo comunitario para promover el uso de la lengua indígena (variante lingüística) del contexto."},{"clave":"LISL 5.1","texto":"Selecciona textos literarios en la lengua indígena (variante lingüística) de su contexto que aborden temas de la comunidad o de algún lugar de interés, los resume y difunde por distintos medios."}],"subcontenidos":[{"clave":"9.1","texto":"Las creaciones artísticas y literarias tradicionales y contemporáneas."},{"clave":"9.2","texto":"La lectura y promoción creativa de creaciones literarias de la comunidad."},{"clave":"9.3","texto":"La reinterpretación de creaciones artísticas que tienen su origen en textos literarios."}],"intencionesSubcontenidos":[{"clave":"9.1","texto":"Reconocer las creaciones artísticas y literarias que puedan ser recopiladas en su comunidad, o que sean muestra de la región o país al que representarán. A través de una temática elegida en asamblea por la pequeña comunidad del aula, elaborar una antología literaria con textos o expresiones de la oralidad pertenecientes a la comunidad o algún lugar de interés. Ello como un recurso para promover, de manera creativa, la lectura y escucha de textos tradicionales y contemporáneos, entre los que se encuentran mitos, leyendas, fábulas, refranes, coplas, canciones, corridos, juegos de palabras, etc."},{"clave":"9.2","texto":"Elaborar una colección de textos en inglés para poder contrastar la riqueza cultural de las características lingüísticas y culturales que otorga el idioma y la lengua como elementos que dan sentido y significado, y, a través de la comunidad, acordar una forma de leer, comprender, explicar y apreciar el contenido de textos en inglés."},{"clave":"9.3","texto":"Realizar un póster que exprese el mensaje de un texto, se pueden utilizar elementos de otra lengua diferente al español. Para esto, decidir en asamblea la lengua indígena que sea propia. Seleccionar, de la producción literaria de esa lengua, el texto o textos que serán analizados para extraer el mensaje y explicarlo."}]},"2":{"nombre":"9. Las creaciones artísticas y literarias, tradicionales y contemporáneas con la comunidad y la expresión de sensaciones.","intencionDidacticaCI":"9. Rescatar las características sociales, culturales y lingüísticas de la comunidad mediante un teatro guiñol, un musical plurilingüístico y una historieta muda para la apreciación de la literatura en distintas lenguas y la expresión de sensaciones vinculadas a la comunidad.","disciplinas":[{"clave":"ESP 9","texto":"Recursos literarios en lengua española para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"ING 9","texto":"El inglés para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"LILM 8","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el trabajo comunitario (tequio) como construcción de relaciones sociales I."},{"clave":"LILM 9","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el trabajo comunitario (tequio) como construcción de relaciones sociales II."},{"clave":"LISL 5","texto":"Creaciones literarias tradicionales y contemporáneas en la lengua indígena (variante lingüística) de su contexto."},{"clave":"ART 8","texto":"Creaciones artísticas que tienen su origen en textos literarios."}],"pda":[{"clave":"ESP 9.1","texto":"Analiza recursos literarios en lengua española para expresar sensaciones, emociones, sentimientos e ideas al elaborar una autobiografía con respecto a los vínculos consigo mismo y con el entorno familiar, escolar o comunitario."},{"clave":"ING 9.1","texto":"Realiza entrevistas en inglés para recuperar opiniones acerca de emociones, sentimientos e ideas sobre la escuela y la comunidad."},{"clave":"LILN 8.1","texto":"Analiza el uso de la lengua indígena (variante lingüística) del contexto en el trabajo comunitario (tequio), para caracterizar la relaciones sociales y redactar los resultados de su análisis."},{"clave":"LILM 9.1","texto":"Analiza el plano semántico de la lengua indígena (variante lingüística) del contexto en torno a mitos, leyendas, fábulas, epopeyas, consejos, dichos, coplas, canciones, corridos y juegos de palabras, entre otros, en torno al trabajo comunitario."},{"clave":"LISL 5.1","texto":"Investiga en textos literarios sobre pueblos indígenas y/o afrodescendientes de México o el mundo."},{"clave":"ART 8.1","texto":"Adapta textos literarios provenientes de culturas indígenas o afrodescendientes, experimentando con elementos de las artes y recursos estéticos como la repetición, ritmo, armonía, contraste y variación, para sensibilizar a la comunidad sobre las formas de expresión de los pueblos originarios."}],"subcontenidos":[{"clave":"9.1","texto":"Los recursos literarios del español e inglés y su uso en la expresión de emociones e ideas relacionadas con la comunidad."},{"clave":"9.2","texto":"La adaptación de textos literarios, tradicionales y contemporáneos a otros lenguajes."},{"clave":"9.3","texto":"El uso y adaptación de las formas de expresión artísticas para la sensibilización de la comunidad."}],"intencionesSubcontenidos":[{"clave":"9.1","texto":"Recrear narraciones biográficas o autobiográficas, en español u otras lenguas, a través de una representación de teatro guiñol para rescatar relatos vinculados a sí mismo o a su comunidad."},{"clave":"9.2","texto":"Adaptar textos literarios, tradicionales y contemporáneos en español a otras lenguas indígenas mediante la organización de un musical plurilingüístico para sensibilizar a la comunidad sobre las formas de expresión de los pueblos originarios."},{"clave":"9.3","texto":"Reinterpretar un texto literario en lengua indígena en una historieta muda para sensibilizar a la comunidad acerca de la relevancia social y cultural de la literatura en lenguas indígenas."}]},"3":{"nombre":"9. Las creaciones artísticas y literarias, tradicionales y contemporáneas relacionadas con la comunidad y la expresión de sensaciones.","intencionDidacticaCI":"9. Recrear, en comunidad, creaciones artísticas y literarias a través de la organización de un festival literario, un cortometraje comunitario y un mini musical cultural para promover el uso de distintos medios visuales, audiovisuales y performativos y, reconocer el impacto de la comunidad en la creación de manifestaciones.","disciplinas":[{"clave":"ESP 8","texto":"Creaciones literarias tradicionales y contemporáneas."},{"clave":"ESP 9","texto":"Recursos literarios en lengua española para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"LILM 5","texto":"Creaciones literarias tradicionales y contemporáneas en la lengua indígena (variante lingüística) de su contexto."},{"clave":"ING 9","texto":"El inglés para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"LISL 5","texto":"Creaciones literarias tradicionales y contemporáneas en la lengua indígena (variante lingüística) de su contexto."},{"clave":"LILM 8","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el trabajo comunitario (tequio) como construcción de relaciones sociales I."},{"clave":"LILM 9","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el trabajo comunitario (tequio) como construcción de relaciones sociales II."},{"clave":"LILM 10","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales entorno a la milpa como sistema de significación."},{"clave":"ART 9","texto":"Expresión artística de sensaciones, emociones, sentimientos e ideas, a partir de experiencias familiares, escolares o comunitarias."}],"pda":[{"clave":"ESP 8.1","texto":"Crea textos, narrativos, poéticos, dramáticos, y guiones audiovisuales, entre otros, a partir del uso de recursos literarios, para exponer una situación real o ficticia."},{"clave":"ESP 9.1","texto":"Recupera recursos literarios de la lengua española para crear un texto libre que describa los vínculos con el entorno familiar, escolar o comunitario."},{"clave":"LILM 5.1","texto":"Crea textos narrativos, poéticos, dramáticos y guiones para audiovisuales, entre otros, a partir del uso de recursos literarios, para exponer una situación real o ficticia en la lengua indígena (variante lingüística) de su contexto."},{"clave":"ING 9.1","texto":"Investiga y recupera manifestaciones culturales y artísticas de su comunidad, para difundirlas en inglés."},{"clave":"LISL 5.1","texto":"Crea textos breves en la lengua indígena (variante lingüística) de su contexto, para exponer una situación o tema de interés con recursos narrativos, poéticos, visuales, escénicos o musicales."},{"clave":"LILM 8.1","texto":"Elabora un ensayo en la lengua indígena (variante lingüística) del contexto sobre el trabajo comunitario (tequio)"},{"clave":"LILM 9.1","texto":"Produce textos como canciones, corridos y juegos de palabras, entre otros, en torno al trabajo comunitario en la lengua indígena (variante lingüística) del contexto."},{"clave":"LILM 10.1","texto":"Produce texto orales o escritos en la lengua indígena (variante lingüístico) del contexto, entorno a la dimensión simbólica – cosmogónica de la milpa."},{"clave":"ART 9.1","texto":"Usa intencionalmente características y funciones de algunos géneros artísticos, para crear una obra original que simbolice sus vínculos con la comunidad."}],"subcontenidos":[{"clave":"9.1","texto":"La utilización de recursos literarios de la lengua española en la creación de un texto narrativo y lírico vinculados a una situación real o ficticia de la comunidad."},{"clave":"9.2","texto":"La creación de narrativas, personales o colectivas, en medios visuales, audiovisuales y performativos."},{"clave":"9.3","texto":"La producción de un discurso narrativo y lírico en torno a las relaciones sociales en la comunidad."}],"intencionesSubcontenidos":[{"clave":"9.1","texto":"Crear y exponer textos narrativos y/o líricos en un festival literario, en distintas lenguas, aplicando los recursos literarios a situaciones reales o ficticias de su comunidad, para expresar emociones e ideas."},{"clave":"9.2","texto":"Capturar una creación narrativa, tradicional o contemporánea, en un cortometraje comunitario para distinguir la importancia de los medios visuales, audiovisuales y performativos y su difusión."},{"clave":"9.3","texto":"Montar un mini musical cultural a partir de la creación de un discurso narrativo y/o lírico que recree situaciones reales o ficticias de su comunidad para reflexionar sobre las relaciones sociales de su entorno."}]}}},{"numero":10,"trimestre":2,"titulo":"10. La expresión artística y los recursos literarios y sus usos a partir de las sensaciones, emociones e ideas asociadas al entorno.","grados":{"1":{"nombre":"10. La expresión artística y los recursos literarios y sus usos a partir de las sensaciones, emociones e ideas asociadas al entorno.","intencionDidacticaCI":"10. Conectar, mediante una carta de presentación emotiva, un texto discursivo y un memorama, el proceso artístico a la comunidad desde la literatura y la escritura, así como repasar los sentimientos, emociones y opiniones acerca de lo que se vive cotidianamente de forma individual y colectiva; tanto en el entorno escolar como comunitario para aumentar el campo de difusión.","disciplinas":[{"clave":"ESP 9","texto":"Recursos literarios en lengua española para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"ING 9","texto":"El inglés para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"ART 9","texto":"Expresión artística de sensaciones, emociones, sentimientos e ideas, a partir de experiencias familiares, escolares o comunitarias."},{"clave":"LILM 6","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el territorio como espacio vital I."},{"clave":"LILM 7","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la tierra como madre y como territorio II."},{"clave":"LISL 6","texto":"La lengua indígena (variante lingüística de su contexto) para expresar sensaciones, emociones e ideas vinculados con las familias, la escuela y la comunidad."}],"pda":[{"clave":"ESP 9.1","texto":"Identifica recursos literarios en lengua española y los emplea en la elaboración de cartas personales y biografías, para expresar sensaciones, emociones, sentimientos e ideas que experimenta en su entorno familiar, escolar o comunitario."},{"clave":"ING 9.1","texto":"Lleva a cabo juegos del lenguaje en inglés para expresar sensaciones, emociones, sentimientos e ideas sobre las familias y la escuela."},{"clave":"ART 9.1","texto":"Recrea lúdicamente sensaciones, emociones, sentimientos e ideas, mediante el uso del cuerpo, del espacio y del tiempo, para expresar la relación con su entorno familiar."},{"clave":"LILM 6.1","texto":"Comprende las prácticas sociales en torno a la tierra como madre y como territorio y el uso de la lengua indígena (variante lingüística) del contexto en tales prácticas."},{"clave":"LILM 7.1","texto":"Reconoce las relaciones entre elementos del territorio y el uso de la lengua indígena (variante lingüística) del contexto para narrarlos en textos orales de distintos géneros."},{"clave":"LISL 6.1","texto":"Lleva a cabo juegos del lenguaje en la lengua indígena (variante lingüística) de su contexto para expresar sensaciones, emociones, sentimientos e ideas sobre las familias y la escuela."}],"subcontenidos":[{"clave":"10.1","texto":"Los recursos literarios de la lengua para la expresión de sensaciones, emociones e ideas."},{"clave":"10.2","texto":"La elaboración de textos personales y sociales vinculados al entorno."},{"clave":"10.3","texto":"La recreación lúdica de expresiones, sensaciones, emociones e ideas a través de recursos artísticos."}],"intencionesSubcontenidos":[{"clave":"10.1","texto":"Escribir una carta de presentación emotiva, dirigida a un amigo anónimo, donde se expresen las sensaciones, emociones, sentimientos e ideas que vengan a la mente con respecto a la vida cotidiana."},{"clave":"10.2","texto":"Redactar un texto discursivo acerca de la importancia social y personal de la comunicación, atendiendo la relevancia de idiomas como el inglés y también, el de las lenguas originarias del país."},{"clave":"10.3","texto":"Elaborar un memorama muy significativo que servirá como un repaso de todo el conocimiento con el que cuentan ahora. Abordar en él problemáticas sobre temas de interés y expresar sentimientos, pensamientos y opiniones."}]},"2":{"nombre":"10. La expresión artística y los recursos literarios y sus usos a partir de las sensaciones, emociones e ideas asociadas al entorno.","intencionDidacticaCI":"10. Reconocer las expresiones artísticas y literarias de la comunidad para realizar un reportaje detectivesco, un diario-escultura móvil y un fanzine comunitario sobre los problemas de la comunidad para fortalecer la comunicación y la expresión de sensaciones, emociones e ideas asociadas al entorno.","disciplinas":[{"clave":"LISL 6","texto":"La lengua indígena (variante lingüística de su contexto) para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"ING 9","texto":"El inglés para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"ART 9","texto":"Expresión artística de sensaciones, emociones, sentimientos e ideas, a partir de experiencias familiares, escolares o comunitarias."},{"clave":"ESP 9","texto":"Recursos literarios en lengua española para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"LILM 6","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el territorio como espacio vital I."}],"pda":[{"clave":"LISL 6.1","texto":"Realiza entrevistas en la lengua indígena (variante lingüística) de su contexto para recuperar opiniones acerca de emociones, sentimientos e ideas sobre la escuela y la comunidad."},{"clave":"ING 9.1","texto":"Realiza entrevistas en inglés para recuperar opiniones acerca de emociones, sentimientos e ideas sobre la escuela y la comunidad."},{"clave":"ART 9.1","texto":"Explora con técnicas artísticas y elige una para apreciar, simbolizar y compartir sensaciones, sentimientos e ideas relacionados con el entorno escolar."},{"clave":"ESP 9.1","texto":"Analiza recursos literarios en lengua española para expresar sensaciones, emociones, sentimientos e ideas al elaborar una autobiografía con respecto a los vínculos consigo mismo y con el entorno familiar, escolar o comunitario."},{"clave":"LILM 6.1","texto":"Redacta textos o audios en torno a las prácticas sociales relacionadas con el territorio y el uso de la lengua indígena (variante lingüística) del contexto en tales prácticas."}],"subcontenidos":[{"clave":"10.1","texto":"El análisis de las técnicas artísticas y los recursos literarios, y su uso en la expresión de sensaciones, emociones e ideas."},{"clave":"10.2","texto":"Los textos informativos y personales vinculados a la comunidad."},{"clave":"10.3","texto":"Los textos orales y/o escritos que reflejan las prácticas sociales de la comunidad."}],"intencionesSubcontenidos":[{"clave":"10.1","texto":"Usar los recursos y técnicas de distintas lenguas y lenguajes en la elaboración de un reportaje detectivesco para recuperar opiniones acerca de sensaciones, emociones e ideas sobre la escuela y la comunidad."},{"clave":"10.2","texto":"Elaborar un diario-escultura móvil para expresar sensaciones, emociones e ideas relacionadas consigo mismo o con la comunidad."},{"clave":"10.3","texto":"Diseñar un fanzine comunitario, en una lengua indígena, que aborde las prácticas sociales relacionadas con el territorio y la comunidad, para valorar el espacio vital de los pueblos originarios."}]},"3":{"nombre":"10. La expresión artística y los recursos literarios y sus usos a partir de las sensaciones, emociones e ideas asociadas al entorno.","intencionDidacticaCI":"10. Utilizar los recursos literarios, las manifestaciones artísticas y culturales como forma de expresión de ideas relacionadas al entorno en la creación de una gaceta comunitaria, un video para redes sociales y una pintura simbólica.","disciplinas":[{"clave":"ESP 8","texto":"Creaciones literarias tradicionales y contemporáneas."},{"clave":"ESP 10","texto":"Los géneros periodísticos y sus recursos para comunicar sucesos significativos familiares, escolares, comunitarios y sociales."},{"clave":"LILM 6","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el territorio como espacio vital I."},{"clave":"LILM 7","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales, relacionadas con la tierra como madre y como territorio II."},{"clave":"LISL 6","texto":"La lengua indígena (variante lingüística) de su contexto para expresar sensaciones, emociones, sentimientos e ideas vinculados con las familias, la escuela y la comunidad."},{"clave":"ING 10","texto":"Relatos en inglés para expresar sucesos significativos familiares, escolares, comunitarios y sociales."},{"clave":"ART 9","texto":"Expresión artística de sensaciones, emociones, sentimientos e ideas, a partir de experiencias familiares, escolares o comunitarias."}],"pda":[{"clave":"ESP 8.1","texto":"Crea textos, narrativos, poéticos, dramáticos, y guiones audiovisuales, entre otros, a partir del uso de recursos literarios, para exponer una situación real o ficticia."},{"clave":"ESP 10.1","texto":"Analiza los sucesos más significativos de la comunidad y los comunica empleando las características de los géneros periodísticos de interpretación, para preservar la memoria colectiva."},{"clave":"LILM 6.1","texto":"Crea textos literarios de distintos géneros o grabación de estos, en torno a las prácticas sociales relacionadas con el territorio y el uso de la lengua indígena (variante lingüística) en tales textos."},{"clave":"LILM 7.1","texto":"Comprende las prácticas sociales en torno a la Madre Tierra como elemento simbólico y al territorio, y el uso de la lengua indígena (variante lingüística) del contexto para recrearlas y producir nuevas"},{"clave":"LISL 6.1","texto":"Investiga y recupera manifestaciones culturales y artísticas de su comunidad indígena de origen para difundirlas en la lengua indígena (variante lingüística) de su contexto."},{"clave":"ING 10.1","texto":"Recupera un acontecimiento histórico comunitario y elabora un texto oral y escrito en inglés para expresar su postura, haciendo uso de recursos visuales o auditivos."},{"clave":"ART 9.1","texto":"Usa intencionalmente características y funciones de algunos géneros artísticos, para crear una obra original que simbolice sus vínculos con la comunidad."}],"subcontenidos":[{"clave":"10.1","texto":"Los recursos literarios de la lengua y de los textos periodísticos en la creación de textos libres relacionados con el entorno."},{"clave":"10.2","texto":"Las manifestaciones culturales y artísticas inspiradas en la comunidad y su difusión."},{"clave":"10.3","texto":"La comunidad como inspiración en la creación de una obra artística."}],"intencionesSubcontenidos":[{"clave":"10.1","texto":"Expresar sensaciones e ideas a través de la creación de textos libres organizados en una gaceta comunitaria para analizar sucesos significativos de la comunidad"},{"clave":"10.2","texto":"Plasmar sensaciones e ideas relacionadas con el entorno en un video para redes sociales con la intención de reflexionar sobre los acontecimientos históricos, culturales y sociales a través de producciones audiovisuales."},{"clave":"10.3","texto":"Recrear figuras, imágenes, sensaciones o ideas inspiradas en la comunidad en una pintura simbólica a fin de representar los vínculos con la comunidad."}]}}},{"numero":11,"trimestre":3,"titulo":"11. Los géneros literarios, no literarios, periodísticos y artísticos y su función en la comunicación de sucesos significativos del entorno y lo laboral.","grados":{"1":{"nombre":"11. Los géneros literarios, no literarios, periodísticos y artísticos y su función en la comunicación de sucesos significativos del entorno y lo laboral.","intencionDidacticaCI":"11. Explorar los géneros literarios, no literarios, periodísticos y artísticos para que, a través de la elaboración de un periódico semanal, una exposición oral colectiva y un acervo artístico, se reconozca su función en la comunicación de sucesos significativos del entorno y lo laboral.","disciplinas":[{"clave":"ESP 10","texto":"Los géneros periodísticos y sus recursos para comunicar sucesos significativos familiares, escolares, comunitarios y sociales."},{"clave":"ING 10","texto":"Relatos en inglés para expresar sucesos significativos familiares, escolares, comunitarios y sociales."},{"clave":"ART 10","texto":"Memoria colectiva representada por medios artísticos, para registrar experiencias comunitarias."},{"clave":"LILM 8","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con el trabajo comunitario (tequio) como construcción de relaciones sociales."},{"clave":"LISL 10","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante. Ya sea de la comunidad de origen o de nuevas prácticas I."},{"clave":"LISL 11","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante. Ya sea de la comunidad de origen o de nuevas prácticas II."}],"pda":[{"clave":"ESP 10.1","texto":"Identifica sucesos significativos familiares, escolares, comunitarios o sociales que forman parte de la memoria colectiva y los comunica haciendo uso de las características de los géneros periodísticos informativos."},{"clave":"ING 10.1","texto":"Entrevista y narra en inglés sucesos significativos familiares, escolares, comunitarios o sociales recuperados de la memoria colectiva."},{"clave":"ART 10.1","texto":"Recupera de la memoria colectiva acontecimientos significativos de las familias, escuela o comunidad, para representarlos de manera creativa."},{"clave":"LILM 8.1","texto":"Reconoce el uso de la lengua indígena (variante lingüística) del contexto en torno al trabajo comunitario (tequio), para realizar narraciones en textos orales de distintos géneros."},{"clave":"LISL 10.1","texto":"Entrevistar a personas de la comunidad y narra sucesos significativos en torno a la práctica cultural relevante en la lengua indígena (variante lingüística) del contexto."},{"clave":"LISL 11.1","texto":"Obtiene información en torno a las prácticas culturales de la lengua indígena (variante lingüística) del contexto"}],"subcontenidos":[{"clave":"11.1","texto":"Identificación de sucesos significativos del entorno."},{"clave":"11.2","texto":"Los diversos géneros textuales y artísticos en la comunicación de la memoria colectiva y expresión comunal en torno al trabajo."},{"clave":"11.3","texto":"Los acervos artísticos de la memoria colectiva."}],"intencionesSubcontenidos":[{"clave":"11.1","texto":"Elaborar en comunidad áulica un periódico semanal que integre noticias que informen a su comunidad sobre los sucesos más significativos que suceden en su entorno."},{"clave":"11.2","texto":"Realizar una exposición oral colectiva con ejemplos de diferentes géneros textuales y artísticos que informen acerca del significado de la memoria colectiva y la expresión comunal en torno al trabajo."},{"clave":"11.3","texto":"Elaborar un acervo artístico de objetos regionales o artesanales que exhiban y den referencia de la memoria colectiva mediante el uso de fichas técnicas."}]},"2":{"nombre":"11. Los géneros literarios, no-literarios, periodísticos y artísticos y su función en la comunicación de sucesos significativos del entorno.","intencionDidacticaCI":"11. Reconocer los géneros literarios, no-literarios, periodísticos y artísticos a través de una tertulia literaria comunitaria, una exposición artística y una nota cultural informativa para apreciar la importancia de la memoria colectiva y fortalecer los lazos de la comunidad.","disciplinas":[{"clave":"ESP 10","texto":"Los géneros periodísticos y sus recursos para comunicar sucesos significativos familiares, escolares, comunitarios y sociales."},{"clave":"LISL 10","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante. Ya sea de la comunidad de origen o de nuevas prácticas I."},{"clave":"ING 10","texto":"Relatos en inglés para expresar sucesos significativos familiares, escolares, comunitarios y sociales."},{"clave":"ART 10","texto":"Memoria colectiva representada por medios artísticos, para registrar experiencias comunitarias."},{"clave":"LILM 11","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la ritualidad como expresión comunal."},{"clave":"LISL 11","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante, ya sea de la comunidad de origen o de nuevas prácticas II."}],"pda":[{"clave":"ESP 10.1","texto":"Investiga un evento familiar, escolar o comunitario significativo de la memoria colectiva, para comunicarlo utilizando las características de los géneros periodísticos de opinión."},{"clave":"LISL 10.1","texto":"Investiga en torno a la práctica cultural relevante en la lengua indígena (variante lingüística) del contexto."},{"clave":"ING 10.1","texto":"Investiga un acontecimiento familiar, escolar o comunitario significativo, recuperado de la memoria colectiva, para redactar una reflexión en inglés."},{"clave":"ART 10.1","texto":"Reinterpreta, mediante características de algunos géneros artísticos, un acontecimiento familiar, escolar o comunitario significado."},{"clave":"LILM 11.1","texto":"Analiza el lenguaje ritual como género discursivo y sus diferencias con el uso cotidiano de la lengua indígena (variante lingüística) del contexto, para redactar textos de distintos géneros, como poemas, cuentos o ensayos."},{"clave":"LISL 11.1","texto":"Indaga y construye propuestas para valorar la práctica cultural relevante de la lengua indígena (variante lingüística) del contexto."}],"subcontenidos":[{"clave":"11.1","texto":"La investigación de un evento significativo y/o una práctica cultural relacionada con la memoria colectiva de la comunidad."},{"clave":"11.2","texto":"La reflexión y construcción de una opinión relacionada a la memoria colectiva."},{"clave":"11.3","texto":"La reinterpretación de eventos comunitarios, familiares o escolares a través de técnicas artísticas."}],"intencionesSubcontenidos":[{"clave":"11.1","texto":"Reconocer y expresar con textos periodísticos de opinión eventos de la comunidad que marcaron la memoria colectiva a través de una tertulia literaria comunitaria para valorar la importancia de los medios de difusión literarios, no-literarios, periodísticos y artísticos."},{"clave":"11.2","texto":"Redactar opiniones, a través de una exposición artística, acerca de los eventos marcados en la memoria colectiva, reflexionando su influencia e importancia en la comunidad."},{"clave":"11.3","texto":"Reconocer, a través de una nota cultural informativa, la importancia que tiene la reinterpretación de prácticas culturales de la comunidad, con la finalidad de preservarlas y difundirlas ante la comunidad."}]},"3":{"nombre":"11. Los géneros literarios, no literarios, periodísticos y artísticos y su función en la comunicación de sucesos significativos del entorno.","intencionDidacticaCI":"11. Investigar y emplear los géneros literarios, no-literarios, periodísticos y artísticos como elementos de comunicación de sucesos significativos del entorno en la producción de un noticiero cultural, de la puesta en escena de un drama social y de una canción conmemorativa.","disciplinas":[{"clave":"ESP 10","texto":"Los géneros periodísticos y sus recursos para comunicar sucesos significativos familiares, escolares, comunitarios y sociales."},{"clave":"ESP 11","texto":"Comunicación asertiva y dialógica para erradicar expresiones de violencia."},{"clave":"LILM 11","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la ritualidad como expresión comunal."},{"clave":"LISL 10","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante. Ya sea de la comunidad de origen o de nuevas prácticas I."},{"clave":"LISL 11","texto":"La lengua indígena (variante lingüística) del contexto a través de una práctica cultural que se considere relevante. Ya sea de la comunidad de origen o de nuevas prácticas II."},{"clave":"ART 10","texto":"Memoria colectiva representada por medios artísticos, para registrar experiencias comunitarias."},{"clave":"ING 10","texto":"Relatos en inglés para expresar sucesos significativos familiares, escolares, comunitarios y sociales."}],"pda":[{"clave":"ESP 10.1","texto":"Analiza los sucesos más significativos de la comunidad y los comunica empleando las características de los géneros periodísticos de interpretación, para preservar la memoria colectiva."},{"clave":"ESP 11.2","texto":"Redacta un texto informativo acerca de la importancia de erradicar la violencia y realiza de manera formal las gestiones necesarias para compartirlo con la comunidad."},{"clave":"LILM 11.1","texto":"Produce y pon en marcha dramatizaciones de textos escritos en la lengua indígena (variante lingüística) del contexto, en torno al lenguaje ritual (teatro comunitario)."},{"clave":"LISL 10.1","texto":"Recuperar acontecimientos históricos en torno a la práctica cultural relevante de la lengua indígena (variante lingüística) del contexto."},{"clave":"LISL 11.1","texto":"Participa en debates en la lengua indígena (variante lingüística) del contexto respecto a la práctica cultural que se considera relevante."},{"clave":"ART 10.1","texto":"Manifiesta una postura crítica sobre la memoria colectiva, acerca de un acontecimiento relevante para la comunidad, al hacer uso de los lenguajes artísticos."},{"clave":"ING 10.1","texto":"Recupera un acontecimiento histórico comunitario y elabora un texto oral y escrito en inglés para expresar su postura, haciendo uso de recursos visuales o auditivos"}],"subcontenidos":[{"clave":"11.1","texto":"La memoria colectiva y su comunicación a través de los géneros periodísticos interpretativos."},{"clave":"11.2","texto":"La producción de textos dramáticos relacionados a las expresiones comunales."},{"clave":"11.3","texto":"La comunicación de forma creativa y lírica de la memoria colectiva a través de lenguajes artísticos o auditivos."}],"intencionesSubcontenidos":[{"clave":"11.1","texto":"Comunicar sucesos significativos pertenecientes a la memoria colectiva mediante un noticiero cultural haciendo uso de los géneros periodísticos y los lenguajes artísticos."},{"clave":"11.2","texto":"Crear un texto dramático que refleje las expresiones comunales e históricas de su comunidad y organizar la puesta en escena de un drama social para la valoración de los géneros dramáticos y de las prácticas culturales."},{"clave":"11.3","texto":"Representar a través de una canción conmemorativa un acontecimiento que pertenezca a la memoria colectiva para valorar el uso de distintas lenguas y lenguajes artísticos o auditivos y su repercusión en la difusión de hechos memorables."}]}}},{"numero":12,"trimestre":3,"titulo":"12. La comunicación asertiva, creativa y dialógica a favor de la sensibilización y erradicación de expresiones de violencia en su contexto.","grados":{"1":{"nombre":"12. La comunicación asertiva, creativa y dialógica a favor de la sensibilización y erradicación de expresiones de violencia en su contexto.","intencionDidacticaCI":"12. Indagar y compartir las características o condiciones de una comunicación asertiva, creativa y dialógica, con la organización y gestión de espacios y recursos a fin de realizar una mesa de discusión, un collage informativo y un decálogo de acciones, para favorecer la sensibilización y erradicación de acciones de violencia.","disciplinas":[{"clave":"ESP 11","texto":"Comunicación asertiva y dialógica para erradicar expresiones de violencia."},{"clave":"ING 11","texto":"Comunicación asertiva y dialógica en inglés, para sensibilizar sobre la erradicación de la violencia en las familias y la escuela."},{"clave":"ART 11","texto":"Procesos creativos que ponen en práctica la comunicación dialógica como estrategia para erradicar expresiones de violencia."},{"clave":"LILM 2","texto":"La diversidad étnica, cultural y lingüística de México en peligro."},{"clave":"LISL 7","texto":"Comunicación asertiva y dialógica en la lengua indígena (variante lingüística) de su contexto, para sensibilizar sobre la erradicación del racismo y la discriminación."},{"clave":"LISL 8","texto":"El uso de la lengua indígena (variante lingüística) de su contexto, en la construcción de mensajes a favor de la inclusión."}],"pda":[{"clave":"ESP 11.1","texto":"Realiza, de manera colectiva, una propuesta oral o por escrito, para promover acciones que posibiliten erradicar la violencia en las familias y la escuela."},{"clave":"ESP 11.2","texto":"Elabora solicitudes de gestión de espacios y recursos para dar a conocer la propuesta."},{"clave":"ING 11.1","texto":"Recupera de distintos textos en inglés, expresiones de violencia presentes en las familias y las escuelas."},{"clave":"ING 11.2","texto":"Reflexiona y comunica de forma oral y escrita una postura de rechazo a la violencia, mediante la comunicación asertiva y dialógica."},{"clave":"ART 11.1","texto":"Expresa, mediante elementos de las artes como las formas, colores, movimientos y sonidos, la relevancia del diálogo como una alternativa a las manifestaciones de violencia presentes en la familia, escuela y comunidad."},{"clave":"LILM 2.1","texto":"Comprende las ideas centrales y secundarias de textos relacionados con el análisis del racismo y de las relaciones interétnicas en la sociedad mexicana, para comentarlas en forma oral y escrita en la lengua indígena, (variante lingüística) de su contexto."},{"clave":"LISL 7.1","texto":"Recupera, de distintas fuentes, expresiones de racismo presentes en su entorno."},{"clave":"LISL 7.2","texto":"Reflexiona y comunica de forma oral y escrita una postura de rechazo al racismo en la lengua indígena (variante lingüística) de su contexto, mediante la comunicación asertiva y dialógica."},{"clave":"LISL 8.1","texto":"Investiga en diversas fuentes sobre las características de los mensajes que presentan información a favor de la interacción, sensibilización y empatía con la diversidad y expone su punto de vista en la lengua indígena (variante lingüística) de su contexto."}],"subcontenidos":[{"clave":"12.1","texto":"La comunicación asertiva, dialógica y la gestión de espacios y recursos para dar a conocer propuestas."},{"clave":"12.2","texto":"Las expresiones de violencia en el contexto."},{"clave":"12.3","texto":"Acciones colectivas a favor de la sensibilización y erradicación de la violencia y de rechazo al racismo."}],"intencionesSubcontenidos":[{"clave":"12.1","texto":"Utilizar la comunicación asertiva, dialógica y la gestión de espacios y recursos como referente para organizar una mesa de discusión con uno de los siguientes temas: Acciones para erradicar la violencia en la familia y en la escuela. El rechazo al racismo en la lengua indígena. Alternativas de solución a la problemática elegida."},{"clave":"12.2","texto":"Buscar una noticia escrita en inglés sobre un acontecimiento de violencia escolar, familiar o comunitaria y elaborar un collage informativo integrado con imágenes y dibujos que muestren la interpretación de la noticia."},{"clave":"12.3","texto":"Desarrollar un diálogo abierto en comunidad para integrar un decálogo de acciones preventivas que puedan ser ejecutadas por la comunidad del aula, para contribuir a la erradicación de la violencia en cualquier contexto."}]},"2":{"nombre":"12. La comunicación asertiva, creativa y dialógica a favor de la sensibilización y erradicación de expresiones de violencia en su contexto.","intencionDidacticaCI":"12. Identificar expresiones asertivas que contribuyan a erradicar la violencia mediante la creación de una infografía de sensibilización, un debate ficcionalizado y de carteles y murales de la paz para la sensibilización y el diálogo en sociedad.","disciplinas":[{"clave":"LISL 8","texto":"El uso de la lengua indígena (variante lingüística) de su contexto, en la construcción de mensajes a favor de la inclusión."},{"clave":"LILM 2","texto":"La diversidad étnica, cultural y lingüística de México en peligro."},{"clave":"LISL 7","texto":"Comunicación asertiva y dialógica en la lengua indígena (variante lingüística) de su contexto, para sensibilizar sobre la erradicación del racismo y la discriminación."},{"clave":"ING 11","texto":"Comunicación asertiva y dialógica en inglés, para sensibilizar sobre la erradicación de la violencia en las familias y la escuela."},{"clave":"ESP 11","texto":"Comunicación asertiva y dialógica para erradicar expresiones de violencia."},{"clave":"ART 11","texto":"Procesos creativos que ponen en práctica la comunicación asertiva y dialógica como estrategia para erradicar expresiones de violencia."}],"pda":[{"clave":"LISL 8.1","texto":"Analiza las características y recursos empleados de la comunicación, asertiva y sugiere su uso en un texto pequeño, escrito en la lengua indígena (variante lingüística) de su contexto, para favorecer una sociedad incluyente."},{"clave":"ESP 11.1","texto":"Participa en un debate acerca de algunas expresiones de violencia -como la de género y la sexual- para argumentar una postura de rechazo."},{"clave":"LILM 2.2","texto":"Utiliza diversos portadores de texto o recursos audiovisuales para compartir las reflexiones en torno al racismo existente en México y América Latina."},{"clave":"LISL 7.1","texto":"Participa en un panel en la lengua indígena (variante lingüística) de su contexto, sobre la importancia de la comunicación asertiva y dialógica, a fin de consensuar propuestas de acción para sensibilizar sobre la erradicación del racismo."},{"clave":"ING 11.1","texto":"Participa en un panel o debate en inglés, sobre la importancia de la comunicación, asertiva y dialógica, a fin de consensuar propuestas de acción para sensibilizar sobre la erradicación de la violencia en las familias y la escuela."},{"clave":"ESP 11.2","texto":"Elabora invitaciones a expertos y redacta oficios de gestión para obtener recursos y espacios donde tendrá lugar el encuentro."},{"clave":"ART 11.1","texto":"Imagina y comparte propuestas artísticas de acción para contribuir en la erradicación de la violencia en la familia, escuela y comunidad, haciendo uso de una comunicación abierta, respetuosa y empática con la diversidad."}],"subcontenidos":[{"clave":"12.1","texto":"Las características y recursos empleados en la comunicación asertiva."},{"clave":"12.2","texto":"La comunicación dialógica y argumentativa como rechazo a las expresiones de violencia."},{"clave":"12.3","texto":"La gestión de propuestas artísticas y sociales para erradicar las expresiones de violencia."}],"intencionesSubcontenidos":[{"clave":"12.1","texto":"Hacer uso de las características y recursos empleados de la comunicación asertiva en una infografía de sensibilización escrita en una lengua indígena para favorecer una sociedad incluyente."},{"clave":"12.2","texto":"Elaborar textos argumentativos para participar en un debate ficcionalizado que favorezca el diálogo dentro de su contexto con la finalidad de expresar su rechazo a situaciones de violencia."},{"clave":"12.3","texto":"Diseñar carteles y murales de la paz con sentido artístico con la previa redacción de oficios de gestión cuyo objetivo es dar propuestas de rechazo a la violencia en diversos contextos sociales de su comunidad y así disminuir su frecuencia."}]},"3":{"nombre":"12. La comunicación asertiva, creativa y dialógica a favor de la sensibilización y erradicación de expresiones de violencia en su contexto.","intencionDidacticaCI":"12. Reconocer medios de difusión a través de un cartel gráfico y una entrevista a personas de la comunidad para erradicar la violencia en su contexto.","disciplinas":[{"clave":"ART 11","texto":"Procesos creativos que ponen en práctica la comunicación dialógica como estrategia para erradicar expresiones de violencia."},{"clave":"LILM 2","texto":"La diversidad étnica, cultural y lingüística de México en peligro."},{"clave":"LISL 7","texto":"Comunicación asertiva y dialógica en la lengua indígena (variante lingüística) de su contexto, para sensibilizar sobre la erradicación del racismo y la discriminación."},{"clave":"LISL 8","texto":"El uso de la lengua indígena (variante lingüística) de su contexto, en la construcción de mensajes a favor de la inclusión."},{"clave":"ING 11","texto":"Comunicación asertiva y dialógica en inglés, para sensibilizar sobre la erradicación de la violencia en las familias y la escuela."},{"clave":"ESP 11","texto":"Comunicación asertiva y dialógica para erradicar expresiones de violencia."}],"pda":[{"clave":"ESP 11.1","texto":"Discute de forma colectiva y diseña una estrategia sobre la importancia de sensibilizar a la comunidad acerca de la violencia."},{"clave":"ART 11.1","texto":"Presenta al público una propuesta artística respetuosa y empática con la diversidad, a fin de sensibilizar a la comunidad acerca de la importancia del diálogo para erradicar la violencia en su contexto."},{"clave":"LILM 2.2","texto":"Comparte una propuesta creativa propia en la que valore y promueva textos en la lengua indígena de su contexto, a favor de una sociedad intercultural."},{"clave":"LISL 7.1","texto":"Diseña y difunde en la lengua indígena (variante lingüística) de su contexto propuestas escritas, para sensibilizar a la comunidad acerca de la importancia de erradicar el racismo."},{"clave":"LISL 8.1","texto":"Construye un proyecto en la lengua indígena (variante lingüística) de su contexto, para valorar la diversidad y fomentar la inclusión social en su entorno."},{"clave":"ING 11.1","texto":"Diseña y difunde en inglés propuestas escritas para sensibilizar a la comunidad acerca de la importancia de erradicar la violencia."},{"clave":"ESP 11.2","texto":"Redacta un texto informativo acerca de la importancia de erradicar la violencia y realiza de manera formal las gestiones necesarias para compartirlo con la comunidad."}],"subcontenidos":[{"clave":"12.1","texto":"El diseño y discusión colectiva de una estrategia sobre la sensibilización de la comunidad en la erradicación de la violencia."},{"clave":"12.2","texto":"Estrategias de sensibilización y su difusión en distintas lenguas hacia la erradicación de la violencia en la comunidad."},{"clave":"12.3","texto":"Realización de gestiones formales que contribuyan a difundir ante la comunidad información que sensibilice sobre la violencia."}],"intencionesSubcontenidos":[{"clave":"12.1","texto":"Elaborar narrativas sobre la erradicación de la violencia con el uso del lenguaje audiovisual a fin de presentar una galería de la salud para compartirla con la comunidad."},{"clave":"12.2","texto":"Representar, en un cartel gráfico, mensajes escritos, en distintas lenguas, en contra de la violencia en la comunidad para la difusión de estrategias que erradiquen cualquier tipo de abuso."},{"clave":"12.3","texto":"Organizar, en comunidad, una pequeña campaña de sensibilización para concientizar sobre la violencia, sus tipos, causas y estrategias de supresión."}]}}},{"numero":13,"trimestre":3,"titulo":"13. Los mensajes artísticos e informativos en la promoción de una vida saludable a través de los medios de comunicación.","grados":{"1":{"nombre":"13. Los mensajes artísticos e informativos en la promoción de una vida saludable a través de los medios de comunicación.","intencionDidacticaCI":"13. Identifica las características de los mensajes, en distintas lenguas, que promueven una vida saludable y la inclusión en medios de comunicación locales a través del diseño de un esquema comparativo, la redacción de un artículo de divulgación y la elaboración de una historieta corta a fin de reconocer su importancia y difusión.","disciplinas":[{"clave":"ESP 12","texto":"Mensajes para promover una vida saludable, expresados en medios comunitarios o masivos de comunicación."},{"clave":"ING 12","texto":"Mensajes en inglés en medios de comunicación masiva, que promueven una vida saludable."},{"clave":"ART 12","texto":"Vida saludable expresada a través de mensajes construidos con elementos de las artes, para difundirlos por distintos medios de comunicación."},{"clave":"LILM 13","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales que se consideren relevantes."},{"clave":"LILM 14","texto":"Estudio de la lengua indígena (variante lingüística) del contexto en sus componentes estructurales."},{"clave":"LISL 8","texto":"El uso de la lengua indígena (variante lingüística) de su contexto, en la construcción de mensajes a favor de la inclusión."}],"pda":[{"clave":"ESP 12.1","texto":"Identifica las características y recursos de los mensajes que promueven una vida saludable a través de los diferentes medios comunitarios o masivos de comunicación impresos o audiovisuales."},{"clave":"ING 12.1","texto":"Recupera en inglés mensajes que promuevan una vida saludable y los difunde de manera oral o escrita, a través de distintos medios de comunicación."},{"clave":"ART 12.1","texto":"Emplea intencionalmente formas, colores, movimientos, sonidos, entre otros elementos de las artes, para representar una vida saludable y la difunde por distintos medios de comunicación escolar."},{"clave":"LILM 13.1","texto":"Conoce y usa la lengua indígena (variante lingüística) del contexto"},{"clave":"LILM 14.1","texto":"Conoce y reflexiona sobre los componentes de la lengua indígena (variante lingüística) del contexto en los planos: fonético-fonológico, morfológico, sintáctico, semántico y pragmático de la lengua indígena."},{"clave":"LISL 8.1","texto":"Investiga en diversas fuentes sobre las características de los mensajes que presentan información a favor de la interacción, sensibilización y empatía con la diversidad y expone su punto de vista en la lengua indígena (variante lingüística) de su contexto."}],"subcontenidos":[{"clave":"13.1","texto":"Las características y recursos de los mensajes informativos en la promoción de una vida saludable."},{"clave":"13.2","texto":"Los elementos para la elaboración de mensajes a favor de una vida saludable."},{"clave":"13.3","texto":"Los elementos artísticos y literarios en la difusión de una vida saludable."}],"intencionesSubcontenidos":[{"clave":"13.1","texto":"Diseñar un esquema comparativo donde se mencionen los diferentes medios de comunicación masivos, impresos, audiovisuales y sus características. Decidir cuál de los medios mencionados es el indicado para difundir y socializar el tema de la salud."},{"clave":"13.2","texto":"Usar las variantes lingüísticas del lugar donde viven para escribir un artículo de divulgación sobre el análisis de las costumbres en la localidad, con el fin de difundir hábitos para una vida saludable en la comunidad."},{"clave":"13.3","texto":"Elaborar una historieta corta donde se despierte el interés por aprender acerca de los hábitos personales sobre una vida saludable, con el fin de invitar a la comunidad a un programa de mejora en la comunidad de aula, además de considerar la sensibilización sobre la lengua indígena."}]},"2":{"nombre":"13. Los mensajes artísticos e informativos en la promoción de la vida saludable a través de las medios de comunicación.","intencionDidacticaCI":"13. Realizar mensajes que promuevan una vida saludable a través de distintas expresiones artísticas como un periódico mural de la salud, un folleto informativo y un taller artístico, para fomentar su difusión.","disciplinas":[{"clave":"ESP 12","texto":"Mensajes para promover una vida saludable, expresados en medios comunitarios o masivos de comunicación."},{"clave":"ING 12","texto":"Mensajes en inglés en medios de comunicación masiva, que promuevan una vida saludable."},{"clave":"ART 12","texto":"Vida saludable expresada a través de mensajes construidos con elementos de las artes, para difundirlos por distintos medios de comunicación."}],"pda":[{"clave":"ESP 12.1","texto":"Elabora un mensaje impreso empleando imágenes, textos, colores y otros recursos gráficos, para favorecer una vida saludable, y lo comparte en la comunidad."},{"clave":"ING 12.1","texto":"Investiga en diversas fuentes en inglés sobre una vida saludable, para construir un texto informativo y difundirlo a través de medios de comunicación."},{"clave":"ART 12.1","texto":"Crea mensajes que promuevan una vida saludable, utilizando artísticamente formas, colores, movimientos y sonidos, entre otros elementos de las artes, para difundirlos por distintos medios de comunicación."}],"subcontenidos":[{"clave":"13.1","texto":"Los mensajes impresos y multimodales a favor de una vida saludable."},{"clave":"13.2","texto":"La investigación de mensajes relacionados con una vida saludable."},{"clave":"13.3","texto":"La construcción, diseño y promoción de mensajes a favor de una vida saludable."}],"intencionesSubcontenidos":[{"clave":"13.1","texto":"Investigar mensajes que empleen imágenes, textos, colores y otros recursos visuales y utilizarlos en la elaboración de un periódico mural de la salud para promover estilos de vida saludable."},{"clave":"13.2","texto":"Investigar en distintas fuentes en inglés la promoción de una vida saludable para diseñar un folleto informativo y difundirlo a través de distintos medios de comunicación."},{"clave":"13.3","texto":"Elaborar mensajes en lengua oral, escrita o artística y presentarlos en un taller artístico para difundirlos en la radio escolar y promover una vida saludable."}]},"3":{"nombre":"13. Los mensajes artísticos e informativos en la promoción de una vida saludable a través de los medios de comunicación.","intencionDidacticaCI":"13. Señalar de manera creativa la importancia de una vida saludable a través de un video artístico sobre la actividad física, una nota informativa de la mala alimentación y una nota periodística ilustrada para la promoción de la vida saludable en la comunidad.","disciplinas":[{"clave":"ESP 12","texto":"Mensajes para promover una vida saludable, expresados en medios comunitarios o masivos de comunicación."},{"clave":"ART 12","texto":"Vida saludable expresada a través de mensajes construidos con elementos de las artes, para difundirlos por distintos medios de comunicación."},{"clave":"ING 12","texto":"Mensajes en inglés en medios de comunicación masiva, que promuevan una vida saludable"}],"pda":[{"clave":"ESP 12.1","texto":"Construyen narrativas acerca de una vida saludable, haciendo uso del lenguaje audiovisual y las transmite por medios comunitarios o masivos de comunicación."},{"clave":"ART 12.1","texto":"Construye una narrativa a favor de una vida saludable, mediante el uso artístico de distintos formatos como fotografía, historieta, secuencia corporal, secuencia sonora, entre otros, y la difunde por distintos medios de comunicación."},{"clave":"ING 12.1","texto":"Cuenta historias en inglés sobre ejemplos de vida saludable y las difunde mediante el uso de medios de comunicación cotidianos, para sensibilizar a la comunidad."}],"subcontenidos":[{"clave":"13.1","texto":"La construcción de narrativas con lenguaje audiovisual sobre una vida saludable."},{"clave":"13.2","texto":"El uso de distintos formatos creativos para la difusión de mensajes a favor de una vida saludable a través de medios de comunicación."},{"clave":"13.3","texto":"La difusión de historias de vida saludable a través de los medios de comunicación cotidianos."}],"intencionesSubcontenidos":[{"clave":"13.1","texto":"Conocer la importancia de una vida saludable mediante la elaboración de un video artístico sobre la actividad física."},{"clave":"13.2","texto":"Reconocer la importancia de los medios de comunicación en la difusión de una vida saludable con la elaboración de una nota informativa creativa para disminuir la mala alimentación en la comunidad."},{"clave":"13.3","texto":"Difundir historias en inglés de vidas saludables de deportistas mediante una nota periodística ilustrada para su reconocimiento y motivación."}]}}},{"numero":14,"trimestre":3,"titulo":"14. La función social y científica de la lengua y los lenguajes.","grados":{"1":{"nombre":"14. La función social y científica de la lengua y los lenguajes.","intencionDidacticaCI":"14. Reflexionar sobre la función social y científica de la lengua y los lenguajes, a partir de la elaboración de un guion de divulgación, una revista sencilla de divulgación de la ciencia local y un guion de exposición, que aborden temas de interés local para promover la investigación, la ciencia y la tecnología.","disciplinas":[{"clave":"ESP 13","texto":"Textos de divulgación científica"},{"clave":"ART 13","texto":"Sistemas alternativos y aumentativos de comunicación, como herramientas creativas que favorecen la inclusión."}],"pda":[{"clave":"ESP 13.1","texto":"Identifica las características del texto de divulgación científica y elabora uno."},{"clave":"ART 13.1","texto":"Identifica algunas características sensoriales de la Lengua de Señas Mexicana, el código Braille, los tableros de comunicación y otros sistemas alternativos y aumentativos, para fomentar la interacción, sensibilización y empatía con la diversidad."}],"subcontenidos":[{"clave":"14.1","texto":"Los lenguajes y su función social en la difusión de la ciencia."},{"clave":"14.2","texto":"La elaboración y diseño de una propuesta de divulgación científica."},{"clave":"14.3","texto":"La exposición oral y/o escrita de un texto de divulgación científica."}],"intencionesSubcontenidos":[{"clave":"14.1","texto":"Revisar varios artículos de divulgación de la ciencia para identificar sus características formales y de fondo. También, elaborar un guion de divulgación que sirva para orientar la escritura de un artículo de divulgación sobre alguna temática de interés para la comunidad donde se ubica la escuela."},{"clave":"14.2","texto":"En comunidad, integrar una revista sencilla de divulgación de la ciencia local, a partir de artículos de divulgación previamente elaborados."},{"clave":"14.3","texto":"Exponer el contenido de los artículos a la comunidad de aula, siguiendo un guion de exposición previamente acordado, que indique etapas, tiempos, participantes y posibles recursos de apoyo."}]},"2":{"nombre":"14. La función social y científica de la lengua y los lenguajes.","intencionDidacticaCI":"14. Reconocer la función social y científica de la lengua y los lenguajes mediante el desarrollo de un tendedero informativo, tablero de comunicación de plantas y un magazín comunal para identificar la importancia de los saberes de los pueblos originarios como parte de la riqueza cultural de México.","disciplinas":[{"clave":"ESP 13","texto":"Textos de divulgación científica."},{"clave":"ART 13","texto":"Sistemas alternativos y aumentativos de comunicación, como herramientas creativas que favorecen la inclusión."}],"pda":[{"clave":"ESP 13.1","texto":"Analiza las características del texto de divulgación científica, para elaborar y dar a conocer diversos textos, científicos, orales o escritos que traten sobre un tema de interés personal o colectivo."},{"clave":"ART 13.1","texto":"Experimenta con sistemas alternativos y aumentativos de comunicación al usar artísticamente el cuerpo, espacio, tiempo, entre otros elementos de las artes en una propuesta comunitaria que visibilice la diversidad y fomente la inclusión social."}],"subcontenidos":[{"clave":"14.1","texto":"Las características de los textos de divulgación científica."},{"clave":"14.2","texto":"La elaboración de distintos textos científicos orales o escritos."},{"clave":"14.3","texto":"La difusión de distintos textos de función social, orales o escritos, sobre un tema de interés."}],"intencionesSubcontenidos":[{"clave":"14.1","texto":"Seleccionar y elaborar textos científicos, orales y escritos, sobre cualquier tema de su interés personal o colectivo, a través de un tendedero informativo, para compartir y analizar sus características y función ante la comunidad."},{"clave":"14.2","texto":"Diseñar un tablero de comunicación de las plantas de su entorno, así como su uso medicinal, para exponerlo en la comunidad y visibilizar la inclusión social."},{"clave":"14.3","texto":"Formula textos orales o escritos en lenguas indígenas en torno a los saberes de los pueblos originarios para reunirse en un magazín comunal que puedan compartirse en comunidad."}]},"3":{"nombre":"14. La función social y científica de la lengua y los lenguajes.","intencionDidacticaCI":"14. Analizar información para la creación de artículos científicos breves, un periódico escolar tridimensional y una feria de experimentos en vivo con el propósito de divulgar información científica.","disciplinas":[{"clave":"ESP 13","texto":"Textos de divulgación científica"}],"pda":[{"clave":"ESP 13.1","texto":"Elabora una propuesta de divulgación científica, con la participación de la comunidad escolar, para fomentar el conocimiento de las ciencias."}],"subcontenidos":[{"clave":"14.1","texto":"La selección y análisis de textos de divulgación científica con la participación de la comunidad escolar."},{"clave":"14.2","texto":"Propuesta de divulgación científica para el fomento del conocimiento de las ciencias en la comunidad escolar."},{"clave":"14.3","texto":"El fomento del conocimiento de las ciencias en la comunidad escolar."}],"intencionesSubcontenidos":[{"clave":"14.1","texto":"Elaborar una propuesta de divulgación científica mediante la escritura y difusión de un artículo científico breve para fomentar el conocimiento de las ciencias."},{"clave":"14.2","texto":"Diseñar y elaborar un periódico escolar tridimensional con artículos de temas científicos que puedan atraer el interés de la comunidad escolar para conocer la importancia de las ciencias en la comunidad."},{"clave":"14.3","texto":"Planificar una feria escolar de experimentos en vivo con la intención de motivar a la comunidad escolar al acercamiento a las ciencias."}]}}},{"numero":15,"trimestre":3,"titulo":"15. El uso de las lenguas en las prácticas y manifestaciones culturales y artísticas a favor de una sociedad incluyente.","grados":{"1":{"nombre":"15. El uso de las lenguas en las prácticas y manifestaciones culturales y artísticas a favor de una sociedad incluyente.","intencionDidacticaCI":"15. Conocer la función de las lenguas en las prácticas y manifestaciones culturales y artísticas, mediante un texto ilustrado, una canción colectiva y una breve semblanza, para favorecer una sociedad inclusiva entorno a algunos sistemas de significación.","disciplinas":[{"clave":"ESP 14","texto":"Manifestaciones culturales y artísticas que favorecen una sociedad incluyente."},{"clave":"ING 13","texto":"El uso del inglés en la construcción de mensajes a favor de la inclusión."},{"clave":"ING 14","texto":"El uso del inglés en las manifestaciones culturales y artísticas que"},{"clave":"ART 14","texto":"Manifestaciones artísticas que emplean sistemas alternativos y aumentativos de comunicación, elaboradas por personas en condición de discapacidad y/o diseñadas para ellas."},{"clave":"LILM 10","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales entorno a la milpa como sistema de significación"},{"clave":"LILM 11","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la ritualidad como expresión comunal."},{"clave":"LILM 12","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la fiesta como expresión comunal."},{"clave":"LISL 8","texto":"El uso de la lengua indígena (variante lingüística) de su contexto, en la construcción de mensajes a favor de la inclusión."},{"clave":"LISL 9","texto":"El uso de la lengua indígena (variante lingüística) de su contexto, en las manifestaciones culturales y artísticas que favorecen la construcción de una sociedad incluyente."},{"clave":"LISL 13","texto":"La lengua indígena (variante lingüística) del contexto, a través de una práctica cultural que se considere relevante ya sea de la comunidad de origen o de nuevas prácticas."}],"pda":[{"clave":"ESP 14.1","texto":"Reconoce manifestaciones culturales y artísticas creadas o ejecutadas por personas con alguna discapacidad, para distinguir sus valores estéticos y creativos y las comparte en forma oral o escrita con la comunidad."},{"clave":"ING 13.1","texto":"Investiga en diversas fuentes en inglés las características de los mensajes que presentan información a favor de la interacción, sensibilización y empatía con la diversidad y expone su punto de vista."},{"clave":"ING 14.1","texto":"Elabora semblanzas en inglés sobre personas en condición de discapacidad, destacadas por contribuir a la cultura y las artes, y las difunde."},{"clave":"ART 14.1","texto":"Reconoce los valores estéticos y creativos de las manifestaciones artísticas realizadas por personas con alguna discapacidad, para fomentar la inclusión."},{"clave":"LILM 10.1","texto":"Reconoce el uso de la lengua indígena (variante lingüística) del contexto en relación con la milpa para realizar narraciones en textos orales de distintos géneros."},{"clave":"LILM 11.1","texto":"Reconoce el uso de la lengua indígena (variante lingüística) del contexto en torno a la ritualidad como expresión comunal, para realizar narraciones en textos orales de distintos géneros."},{"clave":"LILM 12.1","texto":"Reconoce las relaciones entre las fiestas comunales y la construcción de la identidad colectiva, mediante el uso de la lengua indígena (variante lingüística) del contexto, para narrarlas en textos orales."},{"clave":"LISL 8.1","texto":"Investiga en diversas fuentes sobre las características de los mensajes que presentan información a favor de la interacción, sensibilización y empatía con la diversidad y expone su punto de vista en la lengua indígena (variante lingüística) de su contexto."},{"clave":"LISL 9.1","texto":"Elabora semblanzas en la lengua indígena (variante lingüística) de su contexto sobre personas indígenas destacadas por contribuir a la cultura y las artes, y las difunde."},{"clave":"LISL 13.1","texto":"Entrevista a personas y narra sucesos significativos entorno a las prácticas culturales de la lengua indígena (variante lingüística del contexto)"}],"subcontenidos":[{"clave":"15.1","texto":"Las manifestaciones culturales y artísticas que favorecen la construcción de una sociedad incluyente."},{"clave":"15.2","texto":"La inclusión en las manifestaciones artísticas y algunos sistemas de significación."},{"clave":"15.3","texto":"Las semblanzas a favor de la cultura y de la inclusión."}],"intencionesSubcontenidos":[{"clave":"15.1","texto":"Indagar, en diversas fuentes de información, las manifestaciones culturales y artísticas de la comunidad y de otros lugares del país creadas por personas con alguna discapacidad, para elaborar un texto ilustrado que exprese cómo se vinculan y favorecen las distintas manifestaciones en la construcción de una sociedad incluyente."},{"clave":"15.2","texto":"Integrar comunidades de aula para escribir y entonar una canción colectiva que fomente la interacción, sensibilización, la significación y empatía con la diversidad, como una herramienta creativa para impulsar la inclusión en cualquier lugar."},{"clave":"15.3","texto":"Conocer, a través de diferentes fuentes informativas, acerca de personas indígenas que han sobresalido en alguna actividad cultural, artística, política, educativa o social y redactar una breve semblanza de su vida y su obra como un medio para valorar y difundir sus creaciones."}]},"2":{"nombre":"15 El uso de las lenguas en las manifestaciones culturales y artísticas a favor de una sociedad inclusiva.","intencionDidacticaCI":"15. Apreciar la diversidad de lenguajes en las manifestaciones culturales y artísticas mediante un taller sensorial, mensajes escritos o expresiones artísticas y un compendio de textos narrativos originales para fomentar una sociedad inclusiva.","disciplinas":[{"clave":"ING 14","texto":"El uso del inglés en las manifestaciones culturales y artísticas que."},{"clave":"LISL 9","texto":"El uso de la lengua indígena (variante lingüística) de su contexto, en las manifestaciones culturales y artísticas que favorecen la construcción de una sociedad incluyente."},{"clave":"ING 13","texto":"El uso del inglés en la construcción de mensajes a favor de la inclusión."},{"clave":"ART 14","texto":"Manifestaciones artísticas que emplean sistemas alternativos y aumentativos de comunicación, elaboradas por personas en condición de discapacidad y/o diseñadas para ellas."},{"clave":"ESP 14","texto":"Manifestaciones culturales y artísticas que favorecen una sociedad incluyente."},{"clave":"LILM 10","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales entorno a la milpa como sistema de significación."},{"clave":"LILM 11","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la ritualidad como expresión comunal."},{"clave":"LILM 12","texto":"Estudio de la lengua indígena (variante lingüística) del contexto a través de prácticas sociales relacionadas con la fiesta como expresión comunal."},{"clave":"LILM 13","texto":"Estudio de la lengua indígena (variant /* ============================= Markdown minimo ============================= */
function parseInline(str){
  const runs=[]; const re=/(\*\*[^*]+\*\*|\*[^*]+\*)/g;
  let last=0, m;
  while((m=re.exec(str))){
    if(m.index>last) runs.push({text:str.slice(last,m.index)});
    const tok=m[0];
    if(tok.startsWith('**')) runs.push({text:tok.slice(2,-2), bold:true});
    else runs.push({text:tok.slice(1,-1), italic:true});
    last=re.lastIndex;
  }
  if(last<str.length) runs.push({text:str.slice(last)});
  return runs.length?runs:[{text:str}];
}
function parseMarkdownBlocks(md){
  const lines=(md||'').replace(/\r\n/g,'\n').split('\n');
  const blocks=[]; let i=0; let paraBuf=[];
  function flushPara(){ if(paraBuf.length){ blocks.push({type:'p', text:paraBuf.join(' ').trim()}); paraBuf=[]; } }
  while(i<lines.length){
    const line=lines[i];
    if(/^\s*```/.test(line)){
      flushPara(); const pre=[]; i++;
      while(i<lines.length && !/^\s*```/.test(lines[i])){ pre.push(lines[i]); i++; }
      i++; blocks.push({type:'pre', text:pre.join('\n')}); continue;
    }
    const hMatch=line.match(/^(#{1,4})\s+(.*)$/);
    if(hMatch){ flushPara(); blocks.push({type:'h', level:hMatch[1].length, text:hMatch[2].trim()}); i++; continue; }
    const liMatch=line.match(/^\s*[-*]\s+(.*)$/);
    if(liMatch){ flushPara(); blocks.push({type:'li', ordered:false, text:liMatch[1].trim()}); i++; continue; }
    const olMatch=line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(olMatch){ flushPara(); blocks.push({type:'li', ordered:true, text:olMatch[1].trim()}); i++; continue; }
    if(line.trim()===''){ flushPara(); i++; continue; }
    paraBuf.push(line.trim()); i++;
  }
  flushPara();
  return blocks;
}
function runsToHtml(runs){
  return runs.map(r=>{
    let t=escapeHtml(r.text);
    if(r.bold) t=`<strong>${t}</strong>`;
    if(r.italic) t=`<em>${t}</em>`;
    return t;
  }).join('');
}
function mdToHtml(md){
  const blocks=parseMarkdownBlocks(md);
  let html=''; let i=0;
  while(i<blocks.length){
    const b=blocks[i];
    if(b.type==='h'){ html += `<h${b.level<=2?5:6}>${runsToHtml(parseInline(b.text))}</h${b.level<=2?5:6}>`; i++; continue; }
    if(b.type==='pre'){ html += `<div class="script-box">${escapeHtml(b.text)}</div>`; i++; continue; }
    if(b.type==='li'){
      const ordered=b.ordered; const tag=ordered?'ol':'ul';
      let items='';
      while(i<blocks.length && blocks[i].type==='li' && blocks[i].ordered===ordered){
        items += `<li>${runsToHtml(parseInline(blocks[i].text))}</li>`; i++;
      }
      html += `<${tag}>${items}</${tag}>`; continue;
    }
    html += `<p>${runsToHtml(parseInline(b.text))}</p>`; i++;
  }
  return html;
}

// Sustituye la capacidad "sample" de los Artifacts de Claude por una llamada a
// nuestro propio servidor, que a su vez llama a la API de Anthropic con tu llave.
let sampleFn = null;   // se activa si el backend responde
let downloadsCap = { save: browserDownload }; // descarga normal del navegador, siempre disponible

async function initCapabilities(){
  try{
    const res = await fetch('/api/ping', { method:'GET' });
    sampleFn = res.ok ? realSample : null;
  }catch(e){ sampleFn = null; }
}

async function realSample(prompt, options){
  options = options || {};
  const res = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt }),
    signal: options.signal,
  });
  if(!res.ok || !res.body){
    let msg = 'upstream_error';
    try{ const j = await res.json(); msg = j.error || msg; }catch(e){}
    const err = { code: res.status===401? 'not_granted' : (res.status===429?'rate_limited':'upstream_error'), message: msg };
    throw err;
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = '';
  let buf = '';
  let truncated = false;
  while(true){
    let chunk;
    try{ chunk = await reader.read(); }
    catch(e){ throw { code:'cancelled', message:'aborted', text: full }; }
    if(chunk.done) break;
    buf += decoder.decode(chunk.value, { stream:true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if(!payload) continue;
      let evt;
      try{ evt = JSON.parse(payload); }catch(e){ continue; }
      if(evt.delta){
        full += evt.delta;
        if(options.onText) options.onText({ text: full, delta: evt.delta });
      }
      if(evt.truncated) truncated = true;
      if(evt.error){ throw { code:'upstream_error', message: evt.error, text: full }; }
    }
  }
  if(!full) throw { code:'empty_completion', message:'Sin texto generado' };
  return { text: full, truncated, modelTierApplied: 'default' };
}

async function browserDownload({ filename, data }){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return { status:'saved' };
}
