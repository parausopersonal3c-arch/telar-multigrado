  if(gnum===3){ if(st.pasoA) prevBlocks.push(st.pasoA); if(st.pasoB) prevBlocks.push(st.pasoB); }
  const previoTexto = prevBlocks.length? prevBlocks.map((b,i)=>`--- Bloque de actividades anterior ${i+1} ---\n${clamp(b,7000)}`).join('\n\n') : 'Ninguno: este es el primer bloque de actividades de la etapa 4.';
  return baseHeader(ctx,ci) + `\n\nEtapas previas de esta secuencia (para dar continuidad; no las repitas):\n--- Etapa 1 ---\n${clamp(st.intro,900)}\n--- Etapa 2 ---\n${clamp(st.problema,1600)}\n--- Etapa 3 ---\n${clamp(st.propuesta,1600)}\n\nBloques de actividades ya redactados en esta etapa 4 para OTRA parte de la progresión multigrado (continúa la numeración de "Actividad" después de ellos, sin repetirlos ni repetir sus temas o ejemplos):\n${previoTexto}\n\nETAPA 4 · "Paso a paso" — siguiente bloque de actividades de la progresión multigrado, enfocado en cubrir:\n${buildGradeBlock(gnum, g)}\n\nInstrucciones para este bloque:\n- Desarrolla PASO A PASO las actividades, ejercicios, preguntas, juegos y conversaciones (con guion) necesarias para lograr los PDA y el producto indicados arriba.\n- Redacta TODAS las actividades ya resueltas, con las respuestas correctas incluidas, de modo que el alumno pueda trabajar de forma autodidacta.\n- Cada actividad debe traer instrucciones o guion claro para resolverse sola.\n- Incluye inglés y español cuando corresponda al PDA de inglés, siempre con pronunciación aproximada entre corchetes.\n- Al inicio de cada actividad agrega EXACTAMENTE una de estas etiquetas entre corchetes según su alcance: [AULA], [ESCUELA] o [COMUNIDAD].\n- IMPORTANTE: no menciones en ningún momento el grado escolar (no escribas "1er grado", "segundo año", "tercero", etc.); refiérete solo al tema o subtema de cada actividad, como si fuera una sola secuencia continua para todo el grupo.\n- Continúa la numeración de "Actividad" después de los bloques anteriores (si no hay bloques anteriores, inicia en Actividad 1).` + varietySeed();
}
function promptFuentes(ctx,ci,st){
  const pasoCompleto = [st.pasoA, st.pasoB, st.pasoC].filter(Boolean).join('\n\n');
  return baseHeader(ctx,ci) + `\n\nPaso a paso completo de la etapa 4, ya generado (de referencia):\n${clamp(pasoCompleto, 26000)}\n\nETAPA 5 · "Distintas fuentes de consulta"\nA partir de TODAS las actividades anteriores, elabora una lista de los distintos temas trabajados y, para cada uno, sugiere 1 o 2 fuentes de consulta accesibles para alumnos de telesecundaria (el libro de texto gratuito de la asignatura correspondiente, aprende.mx, la biblioteca escolar o comunitaria, personas de la comunidad como fuente oral, etc.). No inventes URLs o títulos de libros específicos que no conozcas con certeza; cuando no estés seguro, sugiere el tipo de fuente en vez de un título exacto. Preséntalo como una lista con formato "- Tema: fuente(s) sugerida(s)".` + varietySeed();
}
function promptPiezas(ctx,ci,st){
  const pasoCompleto = [st.pasoA, st.pasoB, st.pasoC].filter(Boolean).join('\n\n');
  return baseHeader(ctx,ci) + `\n\nPaso a paso completo de la etapa 4, ya generado (de referencia; no lo repitas):\n${clamp(pasoCompleto, 22000)}\n\nETAPA 6 · "Unimos las piezas"\nRedacta una lista breve (viñetas) de recomendaciones, tips o una guía sencilla que ayude a los alumnos de los tres grados a desarrollar bien todas las actividades anteriores: qué deben saber, qué deben hacer, cómo organizarse (en equipos, parejas o de forma individual) y cómo cuidar el tiempo y los materiales. Es el "deber ser" del trabajo, no una actividad nueva.` + varietySeed();
}
function promptFinal(ctx,ci,st){
  return baseHeader(ctx,ci) + `\n\nEtapa 2, con la situación y los productos (de referencia):\n${clamp(st.problema,2800)}\n\nETAPA 7 · "¡Ya lo tenemos!"\nRedacta las actividades de cierre para que los alumnos socialicen y expongan ante el grupo, la escuela o la comunidad los productos de esta secuencia. Organiza tu respuesta en tres momentos, cada uno con un encabezado "### Antes", "### Durante" y "### Después", y en cada uno una lista breve de acciones concretas de preparación, desarrollo y cierre/evaluación de la exposición.` + varietySeed();
}

const CALL_SEQUENCE = ['intro','problema','propuesta','pasoA','pasoB','pasoC','fuentes','piezas','final'];
const STAGE_CALL_META = {
  intro:{build:(ctx,ci,st)=>promptIntro(ctx,ci)},
  problema:{build:(ctx,ci,st)=>promptProblema(ctx,ci,st)},
  propuesta:{build:(ctx,ci,st)=>promptPropuesta(ctx,ci,st)},
  pasoA:{build:(ctx,ci,st)=>promptPaso(ctx,ci,st,1)},
  pasoB:{build:(ctx,ci,st)=>promptPaso(ctx,ci,st,2)},
  pasoC:{build:(ctx,ci,st)=>promptPaso(ctx,ci,st,3)},
  fuentes:{build:(ctx,ci,st)=>promptFuentes(ctx,ci,st)},
  piezas:{build:(ctx,ci,st)=>promptPiezas(ctx,ci,st)},
  final:{build:(ctx,ci,st)=>promptFinal(ctx,ci,st)},
};

/* ============================= Orquestación de generación ============================= */
async function runStage(key){
  const ci = CI_LIST.find(c=>c.numero===state.ciNumero);
  const prompt = STAGE_CALL_META[key].build(state.contexto, ci, state.etapas);
  state.etapaStatus[key]='active';
  renderView();
  const ctl = new AbortController();
  state.abortCtl = ctl;
  try{
    const res = await sampleFn(prompt, {
      cache:false,
      signal: ctl.signal,
      modelTier:'default',
      onText: ({text}) => { state.etapas[key] = text; updateEtapaDom(key); }
    });
    state.etapas[key] = res.text;
    state.etapaStatus[key] = 'done';
    if(res.truncated){ toast('Una sección quedó extensa y pudo cortarse. Puedes regenerarla.', true); }
  }catch(e){
    state.etapaStatus[key]='error';
    if(e.code==='cancelled'){ toast('Generación detenida.'); }
    else{ toast('No se pudo generar esta parte (' + (e.code||'error') + '). Intenta de nuevo.', true); }
    throw e;
  }finally{
    renderView();
  }
}
async function runAll(){
  if(!sampleFn){ toast('No se pudo conectar con el servidor de IA. Revisa que el servidor esté encendido y que ANTHROPIC_API_KEY esté configurada.', true); return; }
  if(state.generating) return;
  state.generating = true;
  CALL_SEQUENCE.forEach(k=>{ if(state.etapaStatus[k]!=='done') state.etapaStatus[k]='pending'; });
  renderView();
  for(const key of CALL_SEQUENCE){
    if(state.etapaStatus[key]==='done') continue;
    try{ await runStage(key); }
    catch(e){ state.generating=false; renderView(); return; }
  }
  state.generating = false;
  pushHistorial();
  renderView();
  toast('¡Actividad multigrado lista!');
}
async function regenerateStage(key){
  if(!sampleFn || state.generating) return;
  state.generating = true; renderView();
  try{ await runStage(key); pushHistorial(); } catch(e){}
  state.generating = false; renderView();
}
function stopGeneration(){ if(state.abortCtl) state.abortCtl.abort(); }

function pushHistorial(){
  const ci = CI_LIST.find(c=>c.numero===state.ciNumero);
  if(!ci) return;
  const allDone = CALL_SEQUENCE.every(k=>state.etapaStatus[k]==='done');
  if(!allDone) return;
  const entry = { id: uid(), fecha: new Date().toISOString(), ciNumero: ci.numero, titulo: ci.titulo, etapas: JSON.parse(JSON.stringify(state.etapas)) };
  state.historial = state.historial.filter(h=>!(h.ciNumero===entry.ciNumero && Date.now() - new Date(h.fecha).getTime() < 15000));
  state.historial.unshift(entry);
  state.historial = state.historial.slice(0,8);
  saveHistorial();
}

function runsToDocxXml(runs){
  return runs.map(r=>{
    let rpr='';
    if(r.bold||r.italic) rpr = '<w:rPr>' + (r.bold?'<w:b/>':'') + (r.italic?'<w:i/>':'') + '</w:rPr>';
    return `<w:r>${rpr}<w:t xml:space="preserve">${xmlEscape(r.text)}</w:t></w:r>`;
  }).join('');
}
function paragraphXml(style, runsXml, indent){
  const ppr = [];
  if(style) ppr.push(`<w:pStyle w:val="${style}"/>`);
  if(indent) ppr.push('<w:ind w:left="360"/>');
  const pprXml = ppr.length? `<w:pPr>${ppr.join('')}</w:pPr>` : '';
  return `<w:p>${pprXml}${runsXml}</w:p>`;
}
function blocksToDocxParas(blocks){
  let xml=''; let i=0;
  while(i<blocks.length){
    const b=blocks[i];
    if(b.type==='h'){ xml += paragraphXml('Heading2', runsToDocxXml(parseInline(b.text))); i++; continue; }
    if(b.type==='pre'){
      b.text.split('\n').forEach(line=>{
        xml += `<w:p><w:pPr><w:spacing w:after="0"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/><w:sz w:val="18"/><w:color w:val="444444"/></w:rPr><w:t xml:space="preserve">${xmlEscape(line||' ')}</w:t></w:r></w:p>`;
      });
      i++; continue;
    }
    if(b.type==='li'){
      const bullet = b.ordered? '' : '•  ';
      xml += paragraphXml(null, (bullet?`<w:r><w:t xml:space="preserve">${bullet}</w:t></w:r>`:'') + runsToDocxXml(parseInline(b.text)), true);
      i++; continue;
    }
    xml += paragraphXml(null, runsToDocxXml(parseInline(b.text)));
    i++;
  }
  return xml;
}
async function buildAndDownloadDocx(){
  if(!downloadsCap){ toast('No se pudo preparar la descarga en este navegador.', true); return; }
  if(typeof JSZip==='undefined'){ toast('No se pudo preparar el archivo de Word.', true); return; }
  const ci = CI_LIST.find(c=>c.numero===state.ciNumero);
  if(!ci) return;
  let body = '';
  body += paragraphXml('Title', runsToDocxXml([{text:'Telar Multigrado'}]));
  body += paragraphXml('Subtitle', runsToDocxXml([{text:`Contenido integrado ${ci.numero}. ${ci.titulo.replace(/^\d+\.\s*/,'')}`}]));
  const ctxLine = state.contexto && state.contexto.comunidad ? `Contexto escolar: ${state.contexto.comunidad}` : '';
  if(ctxLine) body += paragraphXml(null, runsToDocxXml([{text:ctxLine, italic:true}]));

  const sections = [
    {n:1, name:'¿Qué haremos?', text: state.etapas.intro},
    {n:2, name:'¡Ese es el problema!', text: state.etapas.problema},
    {n:3, name:'¡Una propuesta de solución!', text: state.etapas.propuesta},
    {n:4, name:'Paso a paso', text: [state.etapas.pasoA, state.etapas.pasoB, state.etapas.pasoC].filter(Boolean).join('\n\n')},
    {n:5, name:'Distintas fuentes de consulta', text: state.etapas.fuentes},
    {n:6, name:'Unimos las piezas', text: state.etapas.piezas},
    {n:7, name:'¡Ya lo tenemos!', text: state.etapas.final},
  ];
  sections.forEach(s=>{
    if(!s.text) return;
    body += paragraphXml('Heading1', runsToDocxXml([{text:`Etapa ${s.n}. ${s.name}`}]));
    body += blocksToDocxParas(parseMarkdownBlocks(s.text));
  });

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417"/></w:sectPr></w:body></w:document>`;

  try{
    const zip = new JSZip();
    zip.file('[Content_Types].xml', DOCX_CONTENT_TYPES);
    zip.file('_rels/.rels', DOCX_RELS);
    zip.file('docProps/core.xml', DOCX_CORE);
    zip.file('docProps/app.xml', DOCX_APP);
    zip.file('word/_rels/document.xml.rels', DOCX_DOC_RELS);
    zip.file('word/styles.xml', DOCX_STYLES);
    zip.file('word/document.xml', documentXml);
    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const filename = `actividad-multigrado-CI${ci.numero}.docx`;
    await downloadsCap.save({filename, data: blob});
    toast('Descarga lista.');
  }catch(e){
    if(e && e.code==='declined'){ /* nada que hacer */ }
    else toast('No se pudo descargar el archivo.', true);
  }
}

function stageStatus(uiKey){
  if(uiKey==='pasoapaso'){
    const statuses=['pasoA','pasoB','pasoC'].map(k=>state.etapaStatus[k]);
    if(statuses.every(s=>s==='done')) return 'done';
    if(statuses.some(s=>s==='error')) return 'error';
    if(statuses.some(s=>s==='active')) return 'active';
    if(statuses.some(s=>s==='pending')) return 'pending';
    return '';
  }
  return state.etapaStatus[uiKey] || '';
}

function setStep(n){ state.step=n; renderStepper(); renderView(); try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){} }
function renderView(){
  if(state.step===1) renderStep1();
  else if(state.step===2) renderStep2();

function renderStepper(){
  const nav = $('#stepper');
  const steps = [ {n:1, label:'Contexto'}, {n:2, label:'Contenido integrado'}, {n:3, label:'Generación'} ];
  nav.innerHTML = steps.map(s=>{
    let cls='step-tab';
    if(s.n===state.step) cls+=' active'; else if(s.n<state.step) cls+=' done';
    return `<button type="button" class="${cls}" data-goto="${s.n}"><span class="num">${s.n<state.step?'✓':s.n}</span><span class="label">${escapeHtml(s.label)}</span></button>`;
  }).join('');
  $$('.step-tab', nav).forEach(btn=>btn.addEventListener('click', ()=>{
    const n = parseInt(btn.dataset.goto,10);
    if(n===1 || (n===2 && state.contexto) || (n===3 && state.contexto && state.ciNumero)) setStep(n);
  }));
}

      lenguaOriginaria: $('#f-lengua').value.trim(),
      alumnos1: $('#f-al1').value.trim(), alumnos2: $('#f-al2').value.trim(), alumnos3: $('#f-al3').value.trim(),
      caracteristicas: $('#f-carac').value.trim(),
      problematicas: $('#f-problem').value.trim(),
      recursos: $('#f-recursos').value.trim(),
      notasAdicionales: $('#f-notas').value.trim(),
    };
    saveContexto();
    setStep(2);
  });
}

function renderStep2(){
  const trimestres = {1:[],2:[],3:[]};
  CI_LIST.forEach(ci=>trimestres[ci.trimestre].push(ci));
  $('#view-root').innerHTML = `
    ${summaryBarHtml('summary-1', state.contexto.comunidad, [state.contexto.municipioEstado, state.contexto.lenguaOriginaria].filter(Boolean).join(' · ') || 'Contexto escolar guardado', 'Editar')}
    <section class="card">
      <div class="card-eyebrow">Paso 2 de 3</div>
      <div class="card-head"><h2>Elige el contenido integrado</h2></div>
      <p class="card-desc">Selecciona uno de los 15 contenidos integrados del campo formativo Lenguajes. Al elegirlo, se traen automáticamente los PDA y productos de 1°, 2° y 3° grado para ese mismo tema.</p>
      <div style="margin-top:18px;">
        ${[1,2,3].map(t=>`
          <div class="trimestre-block">
            <div class="trimestre-title">Trimestre ${t}</div>
            <div class="ci-grid">
              ${trimestres[t].map(ci=>`
                <button type="button" class="ci-card ${ci.numero===state.ciNumero?'selected':''}" data-num="${ci.numero}">
                  <span class="ci-num">CI ${ci.numero}</span>
                  <span class="ci-title">${escapeHtml(ci.titulo.replace(/^\d+\.\s*/,''))}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      <div id="ci-preview-slot"></div>
    </section>
  `;
  $('#summary-1').addEventListener('click', ()=>setStep(1));
  $$('.ci-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const num = parseInt(btn.dataset.num,10);
      if(state.ciNumero!==num){
        state.ciNumero = num;
        state.etapas = { intro:'', problema:'', propuesta:'', pasoA:'', pasoB:'', pasoC:'', fuentes:'', piezas:'', final:'' };
        state.etapaStatus = {};
      }
      renderStep2();
    });
  });
  if(state.ciNumero) renderCiPreview();
}
function renderCiPreview(){
  const ci = CI_LIST.find(c=>c.numero===state.ciNumero);
  const slot = $('#ci-preview-slot');
  if(!ci || !slot) return;
  slot.innerHTML = `
    <div class="ci-preview">
      <h3>${ci.numero}. ${escapeHtml(ci.titulo.replace(/^\d+\.\s*/,''))}</h3>
      <p class="intencion">${escapeHtml(ci.grados['1'].intencionDidacticaCI)}</p>
      <div class="grade-cols">
        ${[1,2,3].map(n=>{
          const g = ci.grados[String(n)];
          return `<div class="grade-col g${n}">
            <h4>${GRADE_META[n].label}</h4>
            ${g.pda.slice(0,4).map(p=>`<div class="pda-item"><span class="pda-clave">${escapeHtml(p.clave)}</span>${escapeHtml(p.texto)}</div>`).join('')}
            ${g.pda.length>4?`<div class="pda-item" style="opacity:.7">+ ${g.pda.length-4} PDA más…</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btn-usar-ci" type="button">Usar este contenido integrado →</button>
      </div>
    </div>
  `;
  $('#btn-usar-ci').addEventListener('click', ()=> setStep(3));
}

function renderStep3(){
  const ci = CI_LIST.find(c=>c.numero===state.ciNumero);
  if(!ci){ setStep(2); return; }
  const anyStarted = CALL_SEQUENCE.some(k=>state.etapaStatus[k]);
  const allDone = CALL_SEQUENCE.every(k=>state.etapaStatus[k]==='done');

  let html = summaryBarHtml('summary-1b', state.contexto.comunidad, [state.contexto.municipioEstado, state.contexto.lenguaOriginaria].filter(Boolean).join(' · ') || 'Contexto escolar guardado', 'Editar')
    + summaryBarHtml('summary-2b', `CI ${ci.numero} · ${ci.titulo.replace(/^\d+\.\s*/,'')}`, `Trimestre ${ci.trimestre} · Lenguajes · 1°, 2° y 3°`, 'Cambiar');

  if(!anyStarted){
    html += `
      <div class="gen-cta">
        <h2 style="font-size:1.3rem;">Generar actividad multigrado</h2>
        <p>Se redactará una secuencia completa con las 7 etapas del modelo de Telesecundaria para 1°, 2° y 3° grado, adaptada al contexto que registraste. Cada vez que generes, el resultado será distinto, aunque repitas el mismo contenido integrado.</p>
        <button class="btn btn-primary" id="btn-generar" type="button" ${sampleFn?'':'disabled'}>${sampleFn?'✨ Generar actividad multigrado':'Sin conexión con el servidor de IA'}</button>
      </div>
    `;
  } else {
    html += `
      <div class="toolbar">
        <div class="toolbar-left">
          ${UI_STAGES.map(s=>`<span class="chip ${stageStatus(s.key)}"><span class="dot"></span>${s.num}. ${escapeHtml(s.name)}</span>`).join('')}
        </div>
        <div style="display:flex; gap:8px;">
          ${state.generating? `<button class="btn btn-line btn-sm" id="btn-detener" type="button">Detener</button>` : ''}
          ${allDone? `<button class="btn btn-line btn-sm" id="btn-word" type="button">⬇ Descargar en Word</button><button class="btn btn-primary btn-sm" id="btn-nueva-variante" type="button">🔄 Generar otra variante</button>` : ''}
        </div>
      </div>
      <div id="etapas-root">
        ${UI_STAGES.map(s=>renderEtapaCard(s)).join('')}
      </div>
    `;
  }

  $('#view-root').innerHTML = html;
  $('#summary-1b').addEventListener('click', ()=>setStep(1));
  $('#summary-2b').addEventListener('click', ()=>setStep(2));
  const genBtn = $('#btn-generar'); if(genBtn) genBtn.addEventListener('click', runAll);
  const stopBtn = $('#btn-detener'); if(stopBtn) stopBtn.addEventListener('click', stopGeneration);
  const wordBtn = $('#btn-word'); if(wordBtn) wordBtn.addEventListener('click', buildAndDownloadDocx);
  const nuevaBtn = $('#btn-nueva-variante'); if(nuevaBtn) nuevaBtn.addEventListener('click', ()=>{
    state.etapas = { intro:'', problema:'', propuesta:'', pasoA:'', pasoB:'', pasoC:'', fuentes:'', piezas:'', final:'' };
    state.etapaStatus = {};
    runAll();
  });
  if(anyStarted) wireEtapaButtons();
}

function renderEtapaCard(s){
  if(s.key==='pasoapaso'){
    const blocks = [{k:'pasoA', n:1},{k:'pasoB', n:2},{k:'pasoC', n:3}];
    const anyText = blocks.some(b=>state.etapas[b.k] || state.etapaStatus[b.k]);
    return `
      <div class="etapa" data-etapa="pasoapaso">
        <div class="etapa-head">
          <div class="etapa-num">4</div>
          <div class="etapa-titles"><div class="et-name">${escapeHtml(s.name)}</div><div class="et-desc">${escapeHtml(s.desc)}</div></div>
        </div>
        <div class="etapa-body ${anyText?'':'empty'}">
          ${anyText? blocks.map(b=>`
            <div class="grade-sub" data-block="${b.k}">
              <div class="grade-sub-head">
                <span class="grade-sub-label g${b.n}">${GRADE_META[b.n].label}</span>
                ${state.etapas[b.k] ? `<button class="btn btn-line btn-sm" data-regen="${b.k}" ${state.generating?'disabled':''}>↻ Regenerar</button>` : ''}
              </div>
              <div class="prose" data-body="${b.k}">${state.etapas[b.k]? mdToHtml(state.etapas[b.k]) : (state.etapaStatus[b.k]==='active'?'<span class="cursor-blink"></span>':'')}</div>
            </div>
          `).join('') : 'Aún no se genera esta etapa.'}
        </div>
      </div>
    `;
  }
  const text = state.etapas[s.key];
  const status = state.etapaStatus[s.key];
  return `
    <div class="etapa" data-etapa="${s.key}">
      <div class="etapa-head">
        <div class="etapa-num">${s.num}</div>
        <div class="etapa-titles"><div class="et-name">${escapeHtml(s.name)}</div><div class="et-desc">${escapeHtml(s.desc)}</div></div>
        <div class="etapa-actions">
          ${text? `<button class="btn btn-line btn-sm" data-regen="${s.key}" ${state.generating?'disabled':''}>↻ Regenerar</button>`:''}
        </div>
      </div>
      <div class="prose etapa-body ${text?'':'empty'}" data-body="${s.key}">
        ${text? mdToHtml(text) : (status==='active'?'<span class="cursor-blink"></span>':'Aún no se genera esta etapa.')}
      </div>
    </div>
  `;
}
function wireEtapaButtons(){
  $$('[data-regen]').forEach(btn=> btn.addEventListener('click', ()=> regenerateStage(btn.dataset.regen)));
}
function updateEtapaDom(key){
  const el = document.querySelector(`[data-body="${key}"]`);
  if(el){ el.classList.remove('empty'); el.innerHTML = mdToHtml(state.etapas[key]) + '<span class="cursor-blink"></span>'; }
  const uiKey = (key==='pasoA'||key==='pasoB'||key==='pasoC') ? 'pasoapaso' : key;
  const idx = UI_STAGES.findIndex(s=>s.key===uiKey);
  const chipEls = $$('.chip');
  if(idx>=0 && chipEls[idx]){ chipEls[idx].className = 'chip ' + stageStatus(uiKey); }
}

function openHistorial(){
  const old = $('#historial-overlay'); if(old) old.remove();
  const wrap = document.createElement('div');
  wrap.id='historial-overlay';
  wrap.style.cssText='position:fixed;inset:0;background:rgba(20,16,12,0.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;';
  wrap.innerHTML = `
    <div class="card" style="max-width:560px; width:100%; max-height:80vh; overflow:auto;">
      <div class="card-head"><h2>Actividades guardadas</h2><button class="btn btn-icon" id="btn-cerrar-hist" aria-label="Cerrar" type="button">✕</button></div>
      <div class="historial-list" style="margin-top:14px;">
        ${state.historial.length? state.historial.map(h=>`
          <div class="historial-item">
            <div class="hi-txt"><b>CI ${h.ciNumero} · ${escapeHtml(h.titulo.replace(/^\d+\.\s*/,''))}</b><span>${new Date(h.fecha).toLocaleString('es-MX')}</span></div>
            <div class="hi-actions">
              <button class="btn btn-line btn-sm" data-open-hist="${h.id}" type="button">Abrir</button>
              <button class="btn btn-icon" data-del-hist="${h.id}" aria-label="Eliminar" type="button">🗑</button>
            </div>
          </div>
        `).join('') : '<p class="empty-note">Aún no has generado ninguna actividad completa.</p>'}
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  $('#btn-cerrar-hist').addEventListener('click', ()=>wrap.remove());
  $$('[data-open-hist]', wrap).forEach(b=>b.addEventListener('click', ()=>{
    const h = state.historial.find(x=>x.id===b.dataset.openHist);
    if(h){
      state.ciNumero = h.ciNumero;
      state.etapas = JSON.parse(JSON.stringify(h.etapas));
      state.etapaStatus = {}; CALL_SEQUENCE.forEach(k=> state.etapaStatus[k] = state.etapas[k]?'done':'pending');
      wrap.remove();
      setStep(3);
    }
  }));
  $$('[data-del-hist]', wrap).forEach(b=>b.addEventListener('click', ()=>{
    state.historial = state.historial.filter(x=>x.id!==b.dataset.delHist);
    saveHistorial();
    openHistorial();
  }));
}

/* ============================= Arranque ============================= */
async function init(){
  loadStorage();
  if(state.contexto) state.step = 2;
  await initCapabilities();
  renderStepper();
  renderView();
  $('#btn-historial').addEventListener('click', openHistorial);
  $('#btn-reiniciar').addEventListener('click', ()=>{
    state.ciNumero=null;
    state.etapas = { intro:'', problema:'', propuesta:'', pasoA:'', pasoB:'', pasoC:'', fuentes:'', piezas:'', final:'' };
    state.etapaStatus = {};
    setStep(state.contexto?2:1);
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();

})();
</script>
</body>
</html>
